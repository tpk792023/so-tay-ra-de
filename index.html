  if(q.type==='mcq')spec=`<div class="field"><span>Phương án, chọn ô tròn ở phương án đúng</span>${q.options.map((o,k)=>`<div class="opt-row"><label class="radio"><input type="radio" name="e-ans" id="e-ans-${k}" data-e="answer" value="${ABCD[k]}" ${q.answer===ABCD[k]?'checked':''}><b>${ABCD[k]}</b></label><input id="e-opt-${k}" data-eo="${k}" value="${esc(o)}" aria-label="Phương án ${ABCD[k]}"></div>`).join('')}</div>
    <label class="check"><input type="checkbox" id="e-lock" data-e="lockOpts" ${q.lockOpts?'checked':''}>Giữ nguyên thứ tự phương án khi trộn (dùng cho “Cả A và B đều đúng”…)</label>`;
  if(q.type==='tf')spec=`${S.tfEach?`<div class="row"><span class="small muted">Số nhận định của câu dẫn:</span>${[2,3,4].map(n=>`<button class="chip" data-act="tf-n" data-v="${n}" aria-pressed="${q.tf.length===n}">${n} ý</button>`).join('')}</div>`:''}<div class="field"><span>${S.tfEach?'Các nhận định và đáp án':'Bốn ý và đáp án'}</span>${q.tf.map((x,k)=>`<div class="tf-row${S.tfEach?' tf4':''}"><b>${abcd[k]})</b><input id="e-tf-${k}" data-etf="${k}:text" value="${esc(x.text)}" aria-label="Ý ${abcd[k]}"><select id="e-tfa-${k}" data-etf="${k}:ans" aria-label="Đáp án ý ${abcd[k]}"><option value="1" ${x.ans?'selected':''}>Đúng</option><option value="0" ${!x.ans?'selected':''}>Sai</option></select>${S.tfEach?`<select id="e-tfl-${k}" data-etf="${k}:level" aria-label="Mức độ ý ${abcd[k]}"><option value="">Theo câu</option>${LV.map((l,i)=>`<option value="${i}" ${x.level===i?'selected':''}>${l}</option>`).join('')}</select>`:''}</div>`).join('')}</div>`;
  if(q.type==='short')spec=`<label class="field"><span>Đáp án (tối đa 4 ký tự để học sinh tô trên phiếu, ví dụ 12,5 hoặc -4)</span><input id="e-short" data-e="short" value="${esc(q.short)}"></label>`;
  if(q.type==='essay')spec=`<label class="field"><span>Hướng dẫn chấm</span><textarea id="e-essay" data-e="essay" rows="5">${esc(q.essay)}</textarea></label>`;
  return `<div class="m-head"><h2>${Enew?'Thêm câu hỏi':'Sửa câu hỏi'}</h2><button class="icon" data-act="close" aria-label="Đóng">×</button></div>
  <div class="m-body">
    <div class="form">
      <label class="field"><span>Dạng câu</span><select id="e-type" data-e="type">${TYK.map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${TY[t]}</option>`).join('')}</select></label>
      <label class="field"><span>Mức độ</span><select id="e-level" data-e="level">${LV.map((l,i)=>`<option value="${i}" ${q.level===i?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="field"><span>Điểm riêng (trống = ${vn(+S.points[q.type])})</span><input id="e-points" type="number" min="0" step="0.05" data-e="points" value="${esc(q.points)}"></label>
    </div>
    <label class="field"><span>Chủ đề</span><input id="e-topic" data-e="topic" list="topicList" value="${esc(q.topic)}"></label>
    <datalist id="topicList">${S.topics.filter(t=>t.name).map(t=>`<option value="${esc(t.name)}"></option>`).join('')}</datalist>
    <label class="field"><span>Nội dung câu hỏi</span><textarea id="e-stem" data-e="stem" rows="4">${esc(q.stem)}</textarea></label>
    ${spec}
  </div>
  <div class="m-foot"><button class="btn ghost" data-act="close">Hủy</button><button class="btn primary" data-act="save-q">Lưu câu hỏi</button></div>`;
}
function openEditor(id){
  const q=S.questions.find(x=>x.id===id);
  Enew=!q;E=q?JSON.parse(JSON.stringify(q)):newQ(S.ui.filter!=='all'?S.ui.filter:'mcq');
  openModal(editorHTML());
}
function importHTML(){
  return `<div class="m-head"><h2>Dán đề có sẵn hoặc kết quả AI</h2><button class="icon" data-act="close" aria-label="Đóng">×</button></div>
  <div class="m-body">
    <p class="hint">Mở Word, chọn toàn bộ đề (Ctrl+A), sao chép rồi dán vào ô dưới. Mỗi câu bắt đầu bằng “Câu 1.”, phương án “A.” đến “D.”, ý đúng/sai “a)” đến “d)”, và dòng “Đáp án:”. Đúng/Sai tính theo ý thì ghi “Câu dẫn: …”, rồi mỗi nhận định là một câu “Câu 7. …” với “Đáp án: Đúng” hoặc “Sai”. Dòng “Bài: …” giúp xếp câu vào đúng bài trong ma trận. Hình vẽ và công thức dạng ảnh cần thêm lại trong Word sau khi xuất.</p>
    <details><summary>Xem mẫu định dạng</summary><pre class="sample">Câu 1. Bậc của đa thức x³y + 2x² − 5 là
A. 2     B. 3     C. 4     D. 5
Đáp án: C
Mức độ: Biết

Câu 2. Cho A = x² + 6x + 9.
a) A = (x + 3)².
b) A &lt; 0 với mọi x.
c) ...
d) ...
Đáp án: Đ, S, Đ, S

Câu 3. Tính nhanh 99².
Đáp án: 9801

Câu 4. [Tự luận] Phân tích x² − 9 thành nhân tử.
Đáp án: (x − 3)(x + 3)
Điểm: 1</pre></details>
    <textarea id="imp-text" rows="10" placeholder="Dán nội dung đề vào đây…"></textarea>
    <div class="row">
      <label class="field" style="min-width:180px"><span>Mức độ cho câu không ghi</span><select id="imp-level">${LV.map((l,i)=>`<option value="${i}">${l}</option>`).join('')}</select></label>
      <label class="field"><span>Hoặc mở tệp .txt</span><input type="file" id="imp-file" accept=".txt,.md,text/plain"></label>
    </div>
    <div id="imp-result"></div>
  </div>
  <div class="m-foot"><button class="btn ghost" data-act="close">Hủy</button><button class="btn" data-act="imp-preview">Xem trước</button><button class="btn primary" data-act="imp-add">Thêm vào đề</button></div>`;
}
let parsed=[];
function previewImport(){
  parsed=parseText(document.getElementById('imp-text').value,+document.getElementById('imp-level').value);
  const out=document.getElementById('imp-result');
  if(!parsed.length){out.innerHTML='<p class="pill bad">Chưa nhận ra câu nào. Kiểm tra mỗi câu có bắt đầu bằng “Câu 1.” không.</p>';return}
  const c={};TYK.forEach(t=>c[t]=units(parsed.filter(q=>q.type===t)).length);
  const slots=S.questions.filter(isBlankQ).length;
  const noAns=parsed.filter(q=>(q.type==='mcq'&&!q.answer)||(q.type==='short'&&!q.short)).length;
  out.innerHTML=`<div class="row">${TYK.filter(t=>c[t]).map(t=>`<span class="pill ok">${c[t]} câu ${TY[t]}</span>`).join('')}${noAns?`<span class="pill warn">${noAns} câu chưa có đáp án</span>`:''}</div>${slots?`<p class="hint">Các câu sẽ được điền vào ${slots} ô trống của ma trận theo dạng câu, mức độ và bài.</p>`:''}`;
}
function aiHTML(){
  return `<div class="m-head"><h2>Câu lệnh cho ChatGPT / Gemini</h2><button class="icon" data-act="close" aria-label="Đóng">×</button></div>
  <div class="m-body">
    <p class="hint">Câu lệnh được lập đúng theo ma trận – đặc tả (số câu, dạng, mức độ, bài). Khi đề đã đủ câu, câu lệnh dùng để soạn lại; dán kết quả vào thì câu cùng số được thay, không thêm câu. Sao chép, dán sang ChatGPT hoặc Gemini, rồi đưa câu trả lời về bằng nút “Dán kết quả AI”. Luôn đọc lại nội dung AI soạn trước khi dùng.</p>
    <textarea id="ai-text" rows="16" readonly>${esc(aiPrompt())}</textarea>
  </div>
  <div class="m-foot"><button class="btn" data-act="import">Dán kết quả AI</button><button class="btn primary" data-act="copy-ai">Sao chép câu lệnh</button></div>`;
}

  <div class="m-body">
    <p class="hint">Đề chỉ lưu trong trình duyệt của máy này. Sao chép đoạn sao lưu dưới đây và dán vào một tệp Word hoặc Zalo cá nhân để giữ lại hoặc mở trên máy khác.</p>

function newHTML(){
  return `<div class="m-head"><h2>Bắt đầu đề mới?</h2><button class="icon" data-act="close" aria-label="Đóng">×</button></div>
  <div class="m-body"><p>Toàn bộ câu hỏi của đề hiện tại sẽ bị xóa khỏi trình duyệt. Thông tin trường, tổ và ma trận được giữ lại.</p><p class="hint">Nếu cần giữ đề này, bấm Sao lưu trước.</p><h3>Hoặc mở tư liệu có sẵn</h3><p class="hint">Khung ma trận và đặc tả trường đã dùng. Các câu hỏi để trống, đúng bài và mức độ; thầy cô chỉ cần soạn nội dung.</p><div class="row">${Object.entries(TULIEU).map(([k,t])=>`<button class="btn" data-act="load-tl" data-v="${k}">${t.label}</button>`).join('')}</div></div>
  <div class="m-foot"><button class="btn ghost" data-act="close">Hủy</button><button class="btn" data-act="backup">Sao lưu trước</button><button class="btn primary" data-act="new-ok">Xóa và bắt đầu</button></div>`;
}

/* ---------- sao chép ---------- */
async function copyHTML(html){
  const tmp=document.getElementById('copyArea');tmp.innerHTML=html;
  const plain=tmp.innerText;
  try{
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);
    toast('Đã sao chép. Mở Word và bấm Ctrl+V.');
  }catch(_){
    const r=document.createRange();r.selectNodeContents(tmp);const s=getSelection();s.removeAllRanges();s.addRange(r);
    let ok=false;try{ok=document.execCommand('copy')}catch(__){}
    s.removeAllRanges();
    toast(ok?'Đã sao chép. Mở Word và bấm Ctrl+V.':'Trình duyệt chặn sao chép. Hãy bôi đen tờ đề bên dưới rồi bấm Ctrl+C.');
  }
}
async function copyText(id){
  const el=document.getElementById(id);
  try{await navigator.clipboard.writeText(el.value);toast('Đã sao chép.')}
  catch(_){el.focus();el.select();let ok=false;try{ok=document.execCommand('copy')}catch(__){}toast(ok?'Đã sao chép.':'Hãy bấm Ctrl+C để sao chép phần đã chọn.')}
}

/* ---------- sự kiện ---------- */
const ACT={
  go:b=>go(b.dataset.v),
  add:()=>openEditor(null),
  edit:b=>openEditor(b.dataset.id),
  dup:b=>{const i=S.questions.findIndex(q=>q.id===b.dataset.id);const c={...JSON.parse(JSON.stringify(S.questions[i])),id:uid()};S.questions.splice(i+1,0,c);render();toast('Đã nhân bản câu hỏi.')},
  del:b=>{
    if(b.dataset.armed){S.questions=S.questions.filter(q=>q.id!==b.dataset.id);render();toast('Đã xóa câu hỏi.');return}
    b.dataset.armed=1;b.textContent='Bấm lần nữa để xóa';b.classList.add('armed');
    setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Xóa';b.classList.remove('armed')}},3000);
  },
  filter:b=>{S.ui.filter=b.dataset.v;render()},
  mode:b=>{S.ui.mode=b.dataset.v;render()},
  code:b=>{S.ui.code=+b.dataset.v;render()},
  'add-topic':()=>{S.topics.push({chapter:(S.topics[S.topics.length-1]||{}).chapter||'',name:'',req:''});render();const e=document.getElementById(`tp-${S.topics.length-1}-n`);if(e)e.focus()},
  'del-topic':b=>{S.topics.splice(+b.dataset.i,1);render()},
  preset:()=>{S.target={mcq:[6,4,2],tf:[1,2,1],short:[2,2,2],essay:[0,0,0]};S.points={...S.points,mcq:0.25,tf:1,short:0.5};S.info.score=10;S.info.duration=90;render();toast('Đã áp dụng: 12 câu nhiều lựa chọn, 4 câu đúng/sai, 6 câu trả lời ngắn, 90 phút.')},
  'go-matrix':()=>{S.ui.mode='matrix';go('export')},
  'preset-tpl':b=>{const k=b.dataset.v,v=PRESETS[k].v;S.tpl=applyLabels({...S.tpl,...v,lv:v.lv.slice(),preset:k},k);render();toast('Đã áp dụng mẫu: '+PRESETS[b.dataset.v].label)},
  docx:async b=>{b.disabled=true;try{const blob=await buildDocx();await saveFile(`Ma tran - dac ta ${S.info.subject||''} ${S.info.grade||''}`.trim().replace(/[\\/:*?"<>|]/g,'-')+'.docx',blob)}catch(_){toast('Không tạo được file Word. Kiểm tra kết nối mạng rồi thử lại.')}finally{b.disabled=false}},
  'tf-n':b=>{const n=+b.dataset.v;while(E.tf.length<n)E.tf.push({text:'',ans:true});E.tf.length=n;openModal(editorHTML())},
  'preset-etpl':b=>{const v=ETPL_PRESETS[b.dataset.v].v;S.etpl={...S.etpl,...v,preset:b.dataset.v};render();toast('Đã áp dụng mẫu đề: '+ETPL_PRESETS[b.dataset.v].label)},
  'exam-docx':b=>examDocx(b,[+S.ui.code],`Ma ${S.ui.code}`),
  'exam-docx-all':b=>examDocx(b,codes(),`${codes().length} ma`),
  'load-tl':b=>{
    const t=TULIEU[b.dataset.v],d=t.make(),cur=S,n=blank();
    S={...n,info:{...n.info,dept:cur.info.dept||n.info.dept,school:cur.info.school||n.info.school,group:cur.info.group,year:cur.info.year,...d.info},
      points:d.points,target:d.target,tfEach:d.tfEach,topics:d.topics,questions:d.questions,
      tpl:applyLabels({...tplPreset('dp'),signs:cur.tpl.signs.map(s=>s.slice()),place:cur.tpl.place||'Vĩnh Hậu',...d.tpl},'dp'),etpl:etplPreset(d.etpl),view:'matrix'};
    closeModal();render();toast('Đã mở tư liệu: '+t.label);
  },
  ai:()=>openModal(aiHTML()),
  'copy-ai':()=>copyText('ai-text'),
  import:()=>{parsed=[];openModal(importHTML())},
  'imp-preview':()=>previewImport(),
  'imp-add':()=>{previewImport();if(!parsed.length)return;const r=placeParsed(parsed);parsed=[];closeModal();S.ui.filter='all';S.view='questions';render();toast([r.filled&&`điền ${r.filled} ô theo ma trận`,r.replaced&&`thay ${r.replaced} câu cùng số`,r.added&&`thêm ${r.added} câu mới`].filter(Boolean).join(', ').replace(/^./,c=>c.toUpperCase())+'. Hãy đọc lại từng câu.')},
  'save-q':()=>{
    if(Enew)S.questions.push(E);else{const i=S.questions.findIndex(q=>q.id===E.id);S.questions[i]=E}
    const nw=Enew;closeModal();render();toast(nw?'Đã thêm câu hỏi.':'Đã lưu câu hỏi.');
  },
  close:()=>closeModal(),
  backup:()=>openModal(backupHTML()),
  'copy-bk':()=>copyText('bk-out'),
  restore:()=>{
    try{const d=JSON.parse(document.getElementById('bk-in').value);if(!d||!Array.isArray(d.questions))throw 0;S=fix(d);closeModal();render();toast('Đã khôi phục đề.')}
    catch(_){toast('Nội dung không phải bản sao lưu của Sổ Tay Ra Đề.')}
  },
  new:()=>openModal(newHTML()),
  'new-ok':()=>{const b=blank();S={...b,info:{...S.info,subject:S.sample?'':S.info.subject,grade:S.sample?'':S.info.grade},target:S.target,points:S.points,topics:S.sample?[]:S.topics,view:'info'};if(JSON.stringify(S.target)===JSON.stringify(sample().target)){S.target=b.target;S.points=b.points}closeModal();render();toast('Đã tạo đề mới.')},
  copy:()=>{const m=S.ui.mode;copyHTML(m==='exam'?examHTML(+S.ui.code):m==='key'?keyHTML():matrixHTML())},
  'copy-all':()=>copyHTML(codes().map(c=>examHTML(c)).join('<br style="page-break-before:always" clear="all">'))
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){ACT[b.dataset.act]&&ACT[b.dataset.act](b);return}
  if(e.target===modal)closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});

main.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){const [o,k]=t.dataset.bind.split('.');S[o][k]='num' in t.dataset?(t.value===''?'':+t.value):t.value;save();if(o==='info'&&!('re' in t.dataset)){const hp=document.getElementById('headPreview');if(hp)hp.innerHTML=sheetHeader(codes()[0])}}
  if(t.dataset.target){const [ty,l]=t.dataset.target.split(':');S.target[ty][+l]=Math.max(0,parseInt(t.value)||0);save()}
  if(t.dataset.topic){const [i,k]=t.dataset.topic.split(':');S.topics[+i][k]=t.value;save()}
  if('ptf' in t.dataset){S.points.tf=t.value===''?'':+t.value*4;save()}
  if(t.dataset.tpl){const k=t.dataset.tpl;const v=t.type==='checkbox'?t.checked:t.value;if(k==='splitmode'){S.tpl.split=v!=='none';if(v!=='none')S.tpl.types=v}else S.tpl[k]=k==='font'?+v:v;if(!/Title$/.test(k)&&!['include','phanMon','scope','place'].includes(k))S.tpl.preset='custom';save()}
  if(t.dataset.etpl){const k=t.dataset.etpl;const v=t.type==='checkbox'?t.checked:t.value;S.etpl[k]=k==='font'?+v:v;if(!['endText','noteText','abObj','abEssay'].includes(k))S.etpl.preset='custom';save()}
  if(t.dataset.etplName){S.etpl.names[t.dataset.etplName]=t.value;save()}
  if(t.dataset.tplLv){S.tpl.lv[+t.dataset.tplLv]=t.value;S.tpl.preset='custom';save()}
  if(t.dataset.tplSign){const [i,j]=t.dataset.tplSign.split(':');S.tpl.signs[+i][+j]=t.value;save()}
});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ui){S.ui[t.dataset.ui]=t.checked;render();return}
  if(t.dataset.flag){S[t.dataset.flag]=t.checked;render();return}
  if(t.dataset.target||'re' in t.dataset||t.dataset.topic||t.dataset.tpl||t.dataset.tplLv||t.dataset.tplSign||t.dataset.etpl||t.dataset.etplName||'ptf' in t.dataset)setTimeout(render,0);
});
dialog.addEventListener('input',e=>{
  const t=e.target;if(!E)return;
  if(t.dataset.e){
    const k=t.dataset.e;
    if(t.type==='radio'){if(t.checked)E.answer=t.value}
    else if(t.type==='checkbox')E[k]=t.checked;
    else if(k==='level')E.level=+t.value;
    else E[k]=t.value;
    if(k==='type'){const body=dialog.querySelector('.m-body').scrollTop;dialog.innerHTML=editorHTML();dialog.querySelector('.m-body').scrollTop=body}
  }
  if(t.dataset.eo)E.options[+t.dataset.eo]=t.value;
  if(t.dataset.etf){const [i,k]=t.dataset.etf.split(':');E.tf[+i][k]=k==='ans'?t.value==='1':k==='level'?(t.value===''?null:+t.value):t.value}
});
dialog.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp-file'&&t.files[0]){const r=new FileReader();r.onload=()=>{document.getElementById('imp-text').value=r.result;previewImport()};r.readAsText(t.files[0])}
  if(t.id==='bk-file'&&t.files[0]){const r=new FileReader();r.onload=()=>{document.getElementById('bk-in').value=r.result};r.readAsText(t.files[0])}
});

S=load();
render();
</script>
