<!doctype html>
<html lang="vi">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sổ Tay Ra Đề</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: white top bar over a dark navy-teal step rail, one working column (max 1080px); exam and matrix sheets render on white paper in Times New Roman, portrait or landscape */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --soft:#edf3f1; --line:#e2e9e7;
  --ink:#17303a; --muted:#6a7b84;
  --accent:#137b73; --accent-ink:#ffffff; --accent-soft:#e7f4ef;
  --nav:#102b38; --nav-hi:#1e4651; --nav-ink:#b7cdd2; --nav-strong:#ffffff; --gold:#e8b56f;
  --ok:#1d7a55; --ok-soft:#e2f3ea; --warn:#a8650f; --warn-soft:#fff2db; --bad:#b94c42; --bad-soft:#fff1ed;
  --sheet:#ffffff; --sheet-ink:#111111;
  --f-display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --shadow:0 10px 30px rgba(22,55,57,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1b21; --surface:#152730; --soft:#1b313b; --line:#25404a;
  --ink:#e2ecee; --muted:#94a9b0;
  --accent:#3cb5a9; --accent-ink:#04211e; --accent-soft:#12383a;
  --nav:#0a161c; --nav-hi:#1c3d48; --nav-ink:#a9c0c6;
  --ok:#5cc79b; --ok-soft:#12362a; --warn:#e7aa5c; --warn-soft:#3a2b14; --bad:#e8857a; --bad-soft:#3e201c;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b21; --surface:#152730; --soft:#1b313b; --line:#25404a;
  --ink:#e2ecee; --muted:#94a9b0;
  --accent:#3cb5a9; --accent-ink:#04211e; --accent-soft:#12383a;
  --nav:#0a161c; --nav-hi:#1c3d48; --nav-ink:#a9c0c6;
  --ok:#5cc79b; --ok-soft:#12362a; --warn:#e7aa5c; --warn-soft:#3a2b14; --bad:#e8857a; --bad-soft:#3e201c;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:28px;letter-spacing:-.01em}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface)}
.top .bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.rail{background:var(--nav)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:19px}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em}
.mark{width:34px;height:34px;flex:none}
.status{display:inline-flex;align-items:center;font-size:13px;line-height:1.6;padding:3px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.steps{display:flex;flex-wrap:wrap;gap:4px;padding-block:8px}
.step{display:flex;align-items:center;gap:8px;border:none;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--nav-ink);font-weight:600;font-size:14px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--nav-hi);color:var(--nav-ink);font-variant-numeric:tabular-nums}
.step:hover{background:var(--nav-hi);color:var(--nav-strong)}
.step[aria-current="page"]{background:var(--nav-hi);color:var(--nav-strong);box-shadow:inset 0 -3px var(--gold)}
.step[aria-current="page"] .n{background:var(--gold);color:var(--nav)}
.step .dot{min-width:20px;padding:0 6px;height:20px;border-radius:10px;font-size:12px;display:grid;place-items:center;background:var(--bad);color:var(--nav-strong);font-variant-numeric:tabular-nums}
.step .dot.ok{background:var(--accent);color:var(--nav-strong)}
main{padding-block:22px 60px;display:grid;gap:18px}
.lead{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sub{color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h2{margin-right:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.field.wide{grid-column:1/-1}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:var(--nav-strong);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px}
.notice p{flex:1;min-width:220px}
.table-wrap{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.t th,.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.t thead th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.t .num{text-align:center}
.t tfoot th,.t tfoot td{border-bottom:none;font-weight:700}
.cell{width:64px !important;text-align:center;padding:6px !important}
.have{display:block;font-size:12px;color:var(--muted)}
.have.short{color:var(--warn)}.have.over{color:var(--bad)}.have.ok{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--soft);font-weight:500;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}.small{font-size:13px}
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2fr) auto;gap:8px;align-items:start}
.topic-head{align-items:end}
@media (max-width:640px){.topic-row{grid-template-columns:1fr 1fr auto}.topic-row .req{grid-column:1/-1;grid-row:2}.topic-head{display:none}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.part-title{font-family:var(--f-display);font-size:16px;margin-top:6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.part-title small{font-family:var(--f-body);color:var(--muted);font-size:13px}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;gap:8px;min-width:0}
.q.flag{border-left:3px solid var(--warn)}
.q-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qno{font-weight:700;margin-right:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.tag.lv0{background:var(--accent-soft);color:var(--accent)}.tag.lv1{background:var(--warn-soft);color:var(--warn)}.tag.lv2{background:var(--bad-soft);color:var(--bad)}
.grow{flex:1}
.stem{white-space:pre-wrap;overflow-wrap:anywhere}
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:4px 16px}
.opts li{padding:3px 8px;border-radius:6px;overflow-wrap:anywhere}
.opts li.right{background:var(--ok-soft);color:var(--ok);font-weight:600}
.tf{display:grid;gap:3px}
.tf div{display:flex;gap:10px;align-items:baseline}
.ds{font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;flex:none}
.ds.d{background:var(--ok-soft);color:var(--ok)}.ds.s{background:var(--bad-soft);color:var(--bad)}
.ans{font-size:14px}.ans b{color:var(--ok)}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.issue{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.issue:last-child{border-bottom:none}
.issue .what{flex:1;min-width:200px}
.sev{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warn)}.sev.err{background:var(--bad)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bar span{height:12px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}
.sheet-frame{background:var(--soft);border-radius:var(--r);padding:18px;overflow-x:auto}
.sheet{background:var(--sheet);color:var(--sheet-ink);max-width:794px;margin:0 auto;padding:40px 48px;box-shadow:0 1px 3px rgba(0,0,0,.18);min-width:560px}
.sheet.land{max-width:1123px;min-width:880px;padding:36px 40px}
.sheets{display:grid;gap:18px}
.sign-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.pair{display:grid;gap:8px}
.codes{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;border:1px solid var(--line)}
.m-head,.m-foot{display:flex;align-items:center;gap:10px;padding:14px 18px}
.m-head{border-bottom:1px solid var(--line)}.m-head h2{margin-right:auto}
.m-foot{border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap}
.m-body{overflow:auto;padding:16px 18px;display:grid;gap:12px;align-content:start}
.icon{border:none;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px}
.opt-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.tf-row{display:grid;grid-template-columns:auto 1fr 100px;gap:10px;align-items:center}
.tf-row.tf4{grid-template-columns:auto 1fr 90px 110px}
.card h3{margin-top:4px}
.radio{display:flex;align-items:center;gap:6px;cursor:pointer}
.radio input{accent-color:var(--ok);width:16px;height:16px}
.hint{font-size:13px;color:var(--muted)}
pre.sample{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#copyArea{position:fixed;left:-10000px;top:0;width:700px;background:#fff;color:#000}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="2" width="30" height="30" rx="9" fill="var(--nav)"/><path d="M9 11h12M9 16h12M9 21h7" stroke="var(--nav-ink)" stroke-width="1.8" stroke-linecap="round"/><path d="M17 21l4 4 8-10" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Sổ Tay Ra Đề</b><small>Soạn · kiểm tra · trộn mã đề · bản 24/11/2026 (5)</small></div>
    </div>
    <span class="status" id="saveStatus">Đã lưu trong trình duyệt này</span>
    <button class="btn small" data-act="backup">Sao lưu</button>
    <button class="btn small primary" data-act="new">＋ Đề mới</button>
  </div>
  <div class="rail"><div class="wrap"><nav class="steps" id="steps" aria-label="Các bước"></nav></div></div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="modal" class="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>

<div id="copyArea" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const DEFLV=['Biết','Hiểu','Vận dụng'];
let LV=DEFLV.slice();
const TYN={mcq:'Nhiều lựa chọn',tf:'Đúng – Sai',short:'Trả lời ngắn',essay:'Tự luận'};
const TY={mcq:'Nhiều lựa chọn',tf:'Đúng / Sai',short:'Trả lời ngắn',essay:'Tự luận'};
const TYK=['mcq','tf','short','essay'];
const PART={mcq:'Câu trắc nghiệm nhiều phương án lựa chọn',tf:'Câu trắc nghiệm đúng sai',short:'Câu trắc nghiệm trả lời ngắn',essay:'Tự luận'};
const ROMAN=['I','II','III','IV'];
const ABCD='ABCD', abcd='abcd';
const KEY='sotayrade.v1';
const STEPS=[['info','Thông tin đề'],['matrix','Ma trận'],['questions','Câu hỏi'],['review','Kiểm tra'],['export','Xuất đề']];
const main=document.getElementById('main');
let S, E=null, Enew=false;

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('vi-VN',{maximumFractionDigits:2});
const vn=n=>{n=Math.round(n*100)/100;return (Number.isInteger(n)?n.toFixed(1):String(n)).replace('.',',')};
const br=s=>esc(s).replace(/\n/g,'<br>');
const chemOn=()=>/h[oó]a|hoá|khtn|khoa học tự nhiên/i.test(`${S.info.subject} ${S.tpl.phanMon||''}`);
const CHEM=/(^|[^A-Za-z0-9À-ỹ])((?:[A-Z][a-z]?\d*|\((?:[A-Z][a-z]?\d*)+\)\d*)+)(?=$|[^A-Za-z0-9À-ỹ])/g;
function chemParts(l){
  if(!chemOn()||!/\d/.test(l))return [[l,false]];
  const out=[];let last=0,m;CHEM.lastIndex=0;
  while((m=CHEM.exec(l))){
    const tok=m[2],st=m.index+m[1].length;
    if(!/[A-Za-z)]\d/.test(tok)||!/[A-Z]/.test(tok)){continue}
    if(st>last)out.push([l.slice(last,st),false]);
    tok.split(/(\d+)/).forEach((x,k)=>{if(x)out.push([x,k%2===1])});
    last=st+tok.length;
  }
  if(last<l.length)out.push([l.slice(last),false]);
  return out;
}
const cbr=s=>String(s??'').split('\n').map(l=>chemParts(l).map(([x,sub])=>sub?`<sub>${esc(x)}</sub>`:esc(x)).join('')).join('<br>');
const qp=q=>(q.points!==''&&q.points!=null&&!isNaN(+q.points))?+q.points:q.type==='tf'&&S.tfEach?(+S.points.tf||0)/4*q.tf.length:+S.points[q.type]||0;
const blankTF=()=>[0,1,2,3].map(()=>({text:'',ans:true}));
const newQ=(type='mcq',level=0)=>({id:uid(),type,level,topic:'',stem:'',options:['','','',''],answer:'',lockOpts:false,tf:blankTF(),short:'',essay:'',points:''});

const SIGNS=[['Duyệt của Ban giám hiệu',''],['Tổ trưởng chuyên môn',''],['Người ra đề','']];
const SIGNS_DP=['Duyệt của Lãnh đạo','Duyệt của tổ phó','Giáo viên bộ môn'];
const TPL_OFF={color:false,abbr:false,tnkq:false,subjCol:false,pctPts:false,footMerge:false,intro:false,school:false,dateInCol:false,signNote:true,sTotal:true,sFoot:false,pctBase:''};
const PRESETS={
  'dp':{label:'Mẫu Trường TH&THCS Đa Phước',v:{split:true,types:'used',lv:['Biết','Hiểu','Vận dụng'],chapter:true,content:true,mCell:'count',sCell:'qnum',total:true,percent:true,orientM:'landscape',orientS:'landscape',font:12,color:true,abbr:true,tnkq:true,subjCol:true,pctPts:true,footMerge:true,intro:true,school:true,dateInCol:true,signNote:false,sTotal:false,sFoot:true,pctBase:'10'}},
  '7991':{label:'Mẫu CV 7991 (dạng câu × mức độ)',v:{...TPL_OFF,split:true,types:'used',lv:['Biết','Hiểu','Vận dụng'],chapter:true,content:true,mCell:'count',sCell:'qnum',total:true,percent:true,orientM:'landscape',orientS:'landscape',font:12}},
  'nb':{label:'Nhận biết – Thông hiểu – Vận dụng',v:{...TPL_OFF,split:true,types:'used',lv:['Nhận biết','Thông hiểu','Vận dụng'],chapter:true,content:true,mCell:'both',sCell:'countq',total:true,percent:true,orientM:'landscape',orientS:'landscape',font:12}},
  'gon':{label:'Gọn, chỉ theo mức độ',v:{...TPL_OFF,split:false,types:'used',lv:['Biết','Hiểu','Vận dụng'],chapter:false,content:true,mCell:'both',sCell:'countq',total:true,percent:true,orientM:'portrait',orientS:'portrait',font:13}}
};
/* Đổi nhãn tiêu đề và chức danh ký khi chuyển giữa mẫu trường và mẫu chung; họ tên đã nhập được giữ nguyên */
function applyLabels(t,k){
  if(k==='dp'){
    if(/^ma trận đề kiểm tra$/i.test(t.mTitle))t.mTitle='Khung ma trận';
    if(/^bản đặc tả đề kiểm tra$/i.test(t.sTitle))t.sTitle='Bản đặc tả';
    t.signs=SIGNS_DP.map((l,i)=>[l,(t.signs[i]||[])[1]||'']);
  }else{
    if(t.mTitle==='Khung ma trận')t.mTitle='Ma trận đề kiểm tra';
    if(t.sTitle==='Bản đặc tả')t.sTitle='Bản đặc tả đề kiểm tra';

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function version(code){
  const r=rng(code*7919+13);
  return TYK.map(t=>{
    let qs=byType(t);
    if(S.ui.shuffleQ&&t!=='essay')qs=shuffle(qs,r);
    return {type:t,items:qs.map(q=>{
      if(t==='tf')return {q,tf:S.ui.shuffleO&&!q.lockOpts?shuffle(q.tf,r):q.tf};
      if(t!=='mcq')return {q};
      let perm=[0,1,2,3];
      if(S.ui.shuffleO&&!q.lockOpts)perm=shuffle(perm,r);
      const ai=ABCD.indexOf(q.answer);
      return {q,opts:perm.map(p=>q.options[p]),ans:ai<0?'?':ABCD[perm.indexOf(ai)]};
    })};
  }).filter(p=>p.items.length);
}

  const objs=v.filter(p=>p.type!=='essay'),ess=v.find(p=>p.type==='essay');
  const pts=items=>items.reduce((s,it)=>s+qp(it.q),0);
  const ptsRun=n=>X.partPts?[[` (${vn(n)} điểm)`,{i:true}]]:[];
  const head=(t,n,sub)=>B.push({k:'p',runs:[[t,{b:true}],...(n==null?[]:ptsRun(n))],before:sub?60:120});
  let num=0;
  const items=p=>{
    if(!contNum())num=0;
    const each=p.type==='tf'&&S.tfEach;
    const ins=instr(p.type,each?p.items.reduce((a,it)=>a+it.tf.length,0):p.items.length,num+1);
    if(X.instr&&ins)B.push({k:'p',runs:[[ins,{i:true}]]});
    p.items.forEach(it=>{
      const q=it.tf?{...it.q,tf:it.tf}:it.q;
      if(each){B.push({k:'p',runs:[[q.stem,{}]]},{k:'tbl',m:tfTable(q,num)});num+=q.tf.length;return}
      num++;
      if(p.type==='essay'){B.push({k:'p',runs:[[`Câu ${num}`,{b:true}],[` (${vn(qp(q))} điểm)`,{i:true}],['. '+q.stem,{}]]});return}
      B.push({k:'p',runs:[[`Câu ${num}.`,{b:true}],[' '+q.stem,{}]]});
      if(p.type==='mcq')B.push({k:'opts',items:it.opts.map((o,j)=>[ABCD[j]+'.',o]),cols:optCols(it.opts)});
      if(p.type==='tf')q.tf.forEach((x,j)=>B.push({k:'p',runs:[[`${abcd[j]}) ${x.text}`,{}]],ind:1}));
    });
  };
  if(X.partStyle==='ab'){
    if(objs.length){
      head(`A. ${X.abObj.toUpperCase()}`,objs.reduce((s,p)=>s+pts(p.items),0));
      objs.forEach((p,i)=>{if(objs.length>1)head(`${ROMAN[i]}. ${X.names[p.type]}`,X.partPts?pts(p.items):null,true);items(p)});
    }
    if(ess){head(`${objs.length?'B':'A'}. ${X.abEssay.toUpperCase()}`,pts(ess.items));items(ess)}
  }else v.forEach((p,pi)=>{head(`PHẦN ${ROMAN[pi]}. ${X.names[p.type]}`,pts(p.items));items(p)});
  B.push({k:'p',runs:[[X.endText,{}]],al:'c',before:240});
  if(X.note&&X.noteText)B.push({k:'p',runs:[[X.noteText,{i:true}]],al:'c'});
  return B;
}
/* Mẫu đề Trường TH&THCS Đa Phước: PHẦN I. TRẮC NGHIỆM KHÁCH QUAN (1. nhiều lựa chọn, 2. Đúng/Sai), PHẦN II. TỰ LUẬN,
   khung Bài làm, chữ ký GVBM, rồi Hướng dẫn chấm ngay sau đề */
const DPN={mcq:'Trắc nghiệm nhiều lựa chọn',tf:'Câu trắc nghiệm dạng Đúng/Sai',short:'Câu trắc nghiệm trả lời ngắn'};
const nOf=p=>p.type==='tf'&&S.tfEach?p.items.reduce((s,it)=>s+it.tf.length,0):p.items.length;
const ptsTxt=n=>fmt(n);
function dpInstr(t,a,b){
  const r=a===b?`câu ${a}`:`từ câu ${a} đến câu ${b}`;
  if(t==='mcq')return `Khoanh câu trả lời ${r}. Mỗi câu hỏi học sinh chỉ chọn 1 phương án.`;
  if(t==='tf')return S.etpl.sheet?`Học sinh trả lời ${r}, chọn đúng hoặc sai bằng cách điền vào bảng ở phần bài làm.`:`Học sinh trả lời ${r}, đánh dấu X vào cột Đúng hoặc Sai.`;
  return `Học sinh trả lời ${r}.`;
}
function tfTableDp(q,start){
  const H=t=>({t,b:true});
  return {w:[8.3,1,1],head:1,keep:true,rows:[{cells:[H('Nội dung câu hỏi'),H('Đúng'),H('Sai')]},...q.tf.map((x,k)=>({cells:[{pre:`Câu ${start+k+1}.`,t:x.text,al:'l'},{t:''},{t:''}]}))]};
}
function examBlocksDp(code){
  const X=S.etpl,v=version(code),B=[{k:'head',code}];
  const objs=v.filter(p=>p.type!=='essay'),ess=v.find(p=>p.type==='essay');
  const pts=items=>items.reduce((s,it)=>s+qp(it.q),0);
  let num=0;
  const items=p=>{
    p.items.forEach(it=>{
      const q=it.tf?{...it.q,tf:it.tf}:it.q;
      if(p.type==='tf'&&S.tfEach){
        if(q.stem.trim())B.push({k:'p',runs:[[`“${q.stem.trim()}”`,{}]],ind:1,before:40,kn:true});
        B.push({k:'tbl',m:tfTableDp(q,num)});num+=q.tf.length;return;
      }
      num++;
      B.push({k:'p',runs:[[`Câu ${num}.`,{b:true}],[' '+q.stem,{}]],before:40,kn:p.type==='mcq'});
      if(p.type==='mcq')B.push({k:'opts',items:it.opts.map((o,j)=>[ABCD[j]+'.',o]),cols:optCols(it.opts)});
      if(p.type==='tf')q.tf.forEach((x,j)=>B.push({k:'p',runs:[[`${abcd[j]}) ${x.text}`,{}]],ind:1}));
    });
  };
  const roman=['I','II','III'];let pi=0;
  if(objs.length){
    B.push({k:'p',runs:[[`PHẦN ${roman[pi++]}. TRẮC NGHIỆM KHÁCH QUAN (${ptsTxt(objs.reduce((s,p)=>s+pts(p.items),0))} điểm)`,{b:true}]],before:160,kn:true});
    objs.forEach((p,i)=>{
      const n=nOf(p),a=num+1;
      B.push({k:'p',runs:[[`${i+1}. ${DPN[p.type]} (${ptsTxt(pts(p.items))} điểm):`,{b:true,u:true}],[' '+dpInstr(p.type,a,a+n-1),{}]],before:80,kn:true});
      items(p);
    });
  }
  if(ess){B.push({k:'p',runs:[[`PHẦN ${roman[pi++]}. TỰ LUẬN (${ptsTxt(pts(ess.items))} điểm)`,{b:true}]],before:160,kn:true});items(ess)}
  B.push({k:'p',runs:[[X.endText,{b:true}]],al:'c',before:200});
  if(X.note&&X.noteText)B.push({k:'p',runs:[[X.noteText,{i:true}]],al:'c'});
  if(X.sheet)B.push({k:'sheet',v});
  B.push({k:'gv'});
  if(X.keyIn)B.push({k:'pb'},...keyBlocksDp(v));
  return B;
}
/* Hướng dẫn chấm theo mẫu trường (đi kèm từng mã đề) */
function essayRows(q){
  const ls=String(q.essay||'').split('\n').map(x=>x.trim()).filter(Boolean),re=/\(?\s*(\d+(?:[.,]\d+)?)\s*(?:điểm|đ)\s*\)?\s*\.?$/i;
  const rows=ls.map(l=>{const m=l.match(re);return m?{t:l.replace(re,'').trim(),p:+m[1].replace(',','.')}:{t:l,p:null}});
  if(!rows.some(r=>r.p!=null))return [{t:ls.join('\n'),p:qp(q)}];
  const out=[];rows.forEach(r=>{if(r.p==null&&out.length&&out[out.length-1].p==null)out[out.length-1].t+='\n'+r.t;else if(r.p==null&&out.length)out.push({t:r.t,p:null});else out.push(r)});
  /* dòng không ghi điểm gộp vào ý có điểm ngay sau nó */
  const fin=[];let carry='';out.forEach(r=>{if(r.p==null){carry+=(carry?'\n':'')+r.t;return}fin.push({t:(carry?carry+'\n':'')+r.t,p:r.p});carry=''});
  if(carry&&fin.length)fin[fin.length-1].t+='\n'+carry;
  return fin;
}
function keyBlocksDp(v){
  const B=[{k:'keyHead'}],objs=v.filter(p=>p.type!=='essay'),ess=v.find(p=>p.type==='essay');
  const pts=items=>items.reduce((s,it)=>s+qp(it.q),0);
  const H=t=>({t,b:true});
  const roman=['I','II','III'];let pi=0,num=0;
  if(objs.length){
    B.push({k:'p',runs:[[`PHẦN ${roman[pi++]}. TRẮC NGHIỆM KHÁCH QUAN (${ptsTxt(objs.reduce((s,p)=>s+pts(p.items),0))} ĐIỂM)`,{b:true}]],before:160});
    objs.forEach((p,i)=>{
      const each=p.type==='tf'&&S.tfEach;
      const one=each?per('tf'):+S.points[p.type]||0;
      B.push({k:'p',runs:[[`${i+1}. ${DPN[p.type]} (${ptsTxt(pts(p.items))} điểm): `,{b:true}],[each||p.type!=='tf'?`Mỗi câu trả lời đúng được ${fmt(one)} điểm`:`Mỗi câu ${fmt(+S.points.tf)} điểm`,{i:true}]],before:80,after:80});
      if(p.type==='tf'&&each){
        const rows=[{cells:[H('Câu'),H('Đáp án')]}];
        p.items.forEach(it=>it.tf.forEach(x=>rows.push({cells:[{t:String(++num),b:true},{t:x.ans?'Đúng':'Sai'}]})));
        B.push({k:'tbl',m:{w:[1.4,3.3],head:1,rows},wf:.45});
      }else{
        const cells=p.items.map(it=>{num++;return p.type==='mcq'?it.ans:p.type==='tf'?it.tf.map((x,j)=>`${abcd[j]}) ${x.ans?'Đ':'S'}`).join('\n'):String(it.q.short)});
        const first=num-cells.length;
        for(let s=0;s<cells.length;s+=10){
          const ch=cells.slice(s,s+10);
          B.push({k:'tbl',m:{w:[1.3,...ch.map(()=>1)],head:0,rows:[{cells:[H('Câu'),...ch.map((_,k)=>H(String(first+s+k+1)))]},{cells:[H('Đáp án'),...ch.map(t=>({t}))]}]},wf:Math.min(1,.12+.1*ch.length)});
        }
      }
    });
  }
  if(ess){
    B.push({k:'p',runs:[[`PHẦN ${roman[pi++]}. TỰ LUẬN (${ptsTxt(pts(ess.items))} ĐIỂM)`,{b:true}]],before:160,after:80});
    const rows=[{cells:[H('Câu'),H('Nội dung'),H('Điểm')]}];
    ess.items.forEach(it=>{num++;const er=essayRows(it.q);er.forEach((r,k)=>rows.push({cells:[...(k===0?[{t:String(num),b:true,rs:er.length}]:[]),{t:r.t,al:'l'},{t:vn(r.p)}]}))});
    B.push({k:'tbl',m:{w:[1.1,7.3,1.5],head:1,rows}});
  }
  B.push({k:'p',runs:[[S.etpl.endText,{b:true}]],al:'c',before:200});
  return B;
}
/* khung Bài làm: phần trả lời trắc nghiệm ở cột giữa, dòng kẻ chấm cho tự luận */
function sheetModel(v){
  const objs=v.filter(p=>p.type!=='essay'),ess=v.find(p=>p.type==='essay'),out=[];let num=0;
  const H=t=>({t,b:true});
  out.push({p:[['Bài làm',{b:true}]],al:'c'});
  if(objs.length)out.push({p:[['Phần I. Trắc nghiệm khách quan',{b:true}]]});
  objs.forEach((p,i)=>{
    out.push({p:[[`${i+1}. ${DPN[p.type]}:`,{b:true,u:true}]],before:80});
    const n=nOf(p);
    if(p.type==='tf'&&S.tfEach){const rows=[{cells:[H('Câu'),H('Đáp án')]}];for(let k=0;k<n;k++)rows.push({cells:[{t:String(++num),b:true},{t:''}]});out.push({tbl:{w:[1.2,3.3],head:1,rows},wf:.9})}
    else for(let s=0;s<n;s+=8){const c=Math.min(8,n-s);out.push({tbl:{w:[2,...Array(c).fill(1)],head:0,rows:[{cells:[H('Câu'),...Array.from({length:c},(_,k)=>H(String(num+s+k+1)))]},{cells:[H('Đáp án'),...Array(c).fill({t:''})]}]},wf:Math.min(.98,.3+.085*c)})}
    if(!(p.type==='tf'&&S.tfEach))num+=n;
  });
  if(ess){out.push({p:[[`Phần ${objs.length?'II':'I'}. Tự luận`,{b:true,u:true}]],before:120});for(let k=0;k<3;k++)out.push({p:[[DOTS,{}]]})}
  return out;
}

    if(b.k==='keyHead')return keyHeadHTML();
    if(b.cols===1)return b.items.map(([l,t])=>`<p style="margin:0 0 2pt 18pt;${st}"><b>${l}</b> ${cbr(t)}</p>`).join('');
    const rows=[];for(let k=0;k<b.items.length;k+=b.cols)rows.push(b.items.slice(k,k+b.cols));
    return `<table style="width:94%;margin:0 0 3pt 18pt;border-collapse:collapse;${st}">${rows.map(r=>`<tr>${r.map(([l,t])=>`<td style="width:${(100/b.cols).toFixed(0)}%;padding:0 6pt 2pt 0;vertical-align:top"><b>${l}</b> ${cbr(t)}</td>`).join('')}</tr>`).join('')}</table>`;
  }).join('')+'</div>';
}
function tfRule(){const k=+S.points.tf||1;return [0.1,0.25,0.5,1].map(x=>vn(x*k))}
function keyHTML(){
  let h=sheetHeader(null)+`<p style="margin:12pt 0 6pt;text-align:center;${SH}"><b>ĐÁP ÁN VÀ HƯỚNG DẪN CHẤM</b></p>`;
  const parts=TYK.filter(t=>byType(t).length);
  const rule=[];
  parts.forEach((t,pi)=>{
    if(t==='mcq')rule.push(`Phần ${ROMAN[pi]}: mỗi câu trả lời đúng được ${vn(+S.points.mcq)} điểm.`);
    if(t==='tf'&&S.tfEach)rule.push(`Phần ${ROMAN[pi]}: mỗi câu (nhận định) đúng được ${vn((+S.points.tf||0)/4)} điểm.`);
    else if(t==='tf'){const r=tfRule();rule.push(`Phần ${ROMAN[pi]}: mỗi câu ${vn(+S.points.tf)} điểm. Chọn đúng 1 ý được ${r[0]} điểm; 2 ý được ${r[1]} điểm; 3 ý được ${r[2]} điểm; cả 4 ý được ${r[3]} điểm.`)}
    if(t==='short')rule.push(`Phần ${ROMAN[pi]}: mỗi câu trả lời đúng được ${vn(+S.points.short)} điểm.`);
  });
  rule.forEach(r=>h+=`<p style="${P0}">${r}</p>`);
  codes().forEach(code=>{
    const v=version(code);
    h+=`<p style="margin:12pt 0 4pt;${SH}"><b>Mã đề ${code}</b></p>`;
    v.forEach(p=>{
      const pi=parts.indexOf(p.type),off=startOf(p.type);
      if(p.type==='mcq'){
        for(let s=0;s<p.items.length;s+=10){
          const ch=p.items.slice(s,s+10);
          h+=`<table style="border-collapse:collapse;margin:0 0 4pt;${SH}"><tr><td style="${TD}"><b>Phần ${ROMAN[pi]}</b></td>${ch.map((_,k)=>`<td style="${TD}">${off+s+k+1}</td>`).join('')}</tr><tr><td style="${TD}">Đáp án</td>${ch.map(it=>`<td style="${TD}"><b>${it.ans}</b></td>`).join('')}</tr></table>`;
        }
      }
      if(p.type==='tf'&&S.tfEach){
        const st=p.items.flatMap(it=>it.tf.map(x=>x.ans?'Đ':'S'));
        for(let s=0;s<st.length;s+=10){const ch=st.slice(s,s+10);h+=`<table style="border-collapse:collapse;margin:0 0 4pt;${SH}"><tr><td style="${TD}"><b>Phần ${ROMAN[pi]}</b></td>${ch.map((_,k)=>`<td style="${TD}">${off+s+k+1}</td>`).join('')}</tr><tr><td style="${TD}">Đáp án</td>${ch.map(a=>`<td style="${TD}"><b>${a}</b></td>`).join('')}</tr></table>`}
      }
      else if(p.type==='tf'){
        h+=`<table style="border-collapse:collapse;margin:0 0 4pt;${SH}"><tr><td style="${TD}"><b>Phần ${ROMAN[pi]}</b></td>${p.items.map((_,k)=>`<td style="${TD}">Câu ${off+k+1}</td>`).join('')}</tr><tr><td style="${TD}">Đáp án</td>${p.items.map(it=>`<td style="${TD}">${it.tf.map((x,j)=>`${abcd[j]}) ${x.ans?'Đ':'S'}`).join('<br>')}</td>`).join('')}</tr></table>`;
      }
      if(p.type==='short'){
        h+=`<table style="border-collapse:collapse;margin:0 0 4pt;${SH}"><tr><td style="${TD}"><b>Phần ${ROMAN[pi]}</b></td>${p.items.map((_,k)=>`<td style="${TD}">${off+k+1}</td>`).join('')}</tr><tr><td style="${TD}">Đáp án</td>${p.items.map(it=>`<td style="${TD}"><b>${esc(it.q.short)}</b></td>`).join('')}</tr></table>`;
      }
    });
  });
  const es=byType('essay');
  if(es.length){
    const pi=parts.indexOf('essay');
    h+=`<p style="margin:12pt 0 4pt;${SH}"><b>Phần ${ROMAN[pi]}. Tự luận</b> (dùng chung cho mọi mã đề)</p><table style="border-collapse:collapse;width:100%;${SH}"><tr><td style="${TD}"><b>Câu</b></td><td style="${TD}"><b>Nội dung</b></td><td style="${TD}"><b>Điểm</b></td></tr>${es.map((q,k)=>`<tr><td style="${TD}">${startOf('essay')+k+1}</td><td style="border:1px solid #000;padding:2pt 6pt;text-align:left">${br(q.essay)}</td><td style="${TD}">${vn(qp(q))}</td></tr>`).join('')}</table>`;
  }
  return `<div style="${SH}">${h}</div>`;
}
const sumP=qs=>qs.reduce((s,q)=>s+qp(q),0);
const sumU=us=>us.reduce((s,u)=>s+u.pts,0);
const up=s=>String(s??'').toUpperCase();
/* Đơn vị đếm trong ma trận: một câu, hoặc một ý Đúng/Sai khi "mỗi ý tính là một câu" (mẫu trường) */
function units(qs){
  const out=[];
  qs.forEach(q=>{
    if(S.tfEach&&q.type==='tf'){const p=qp(q)/q.tf.length;q.tf.forEach((x,k)=>out.push({q,k,type:'tf',level:(x.level===0||x.level)?+x.level:q.level,pts:p}))}
    else out.push({q,k:-1,type:q.type,level:q.level,pts:qp(q)});
  });
  return out;
}
const contNum=()=>!!S.tfEach||S.etpl.numbering==='continuous';
function specRows(){
  const names=S.topics.map(t=>t.name.trim()).filter(Boolean);
  S.questions.forEach(q=>{const n=q.topic.trim();if(n&&!names.includes(n))names.push(n)});
  const rows=names.map(n=>{const tp=S.topics.find(t=>t.name.trim()===n)||{};return {name:n,chapter:(tp.chapter||'').trim(),req:tp.req||'',qs:[]}});
  const none={name:'(Chưa gắn chủ đề)',chapter:'',req:'',qs:[]};
  S.questions.forEach(q=>(rows.find(r=>r.name===q.topic.trim())||none).qs.push(q));
  if(none.qs.length)rows.push(none);
  rows.forEach(r=>{const us=units(r.qs);r.c=[0,1,2].map(l=>us.filter(u=>u.level===l).length)});
  return rows;
}

/* ---------- ma trận & đặc tả theo mẫu ---------- */
function grouped(){
  const T=S.tpl,rows=specRows();
  if(!T.chapter)return rows.map(r=>[r]);
  const g=[];rows.forEach(r=>{const x=g.find(a=>a[0].chapter===r.chapter);x?x.push(r):g.push([r])});
  if(!T.content)return g.map(a=>[{name:'',chapter:a[0].chapter,req:a.map(r=>r.req).filter(Boolean).join('\n'),qs:a.flatMap(r=>r.qs)}]);
  return g;
}
function tplTypes(){const T=S.tpl;return T.split?(T.types==='all'?TYK:TYK.filter(t=>byType(t).length)):[null]}
function numMap(){
  const m={};
  if(contNum()){let n=0;TYK.forEach(t=>byType(t).forEach(q=>{if(S.tfEach&&t==='tf')q.tf.forEach((_,k)=>m[q.id+':'+k]=++n);else m[q.id]=++n}))}
  else TYK.forEach(t=>byType(t).forEach((q,k)=>m[q.id]=k+1));
  return m;
}
function uLabel(u,nm){
  if(contNum())return 'Câu '+nm[u.k>=0?u.q.id+':'+u.k:u.q.id];
  const parts=TYK.filter(t=>byType(t).length);
  return (S.tpl.split?'C':ROMAN[parts.indexOf(u.type)]+'.C')+nm[u.q.id];
}
const pctOf=us=>{const b=+S.tpl.pctBase||totalPts();return us.length&&b?(Math.round(sumU(us)/b*1000)/10).toLocaleString('vi-VN')+'%':''};
function cellText(us,mode,nm){
  if(!us.length)return '';
  const nums=sep=>us.map(u=>uLabel(u,nm)).join(sep);
  if(mode==='points')return vn(sumU(us));
  if(mode==='both')return `${us.length}\n(${vn(sumU(us))}đ)`;
  if(mode==='qnum')return nums(contNum()?'\n':', ');
  if(mode==='countq')return `${us.length}\n(${nums(', ')})`;
  if(mode==='pct')return pctOf(us);
  return String(us.length);
}
const ABBR={'biết':'B','hiểu':'H','vận dụng':'VD','nhận biết':'NB','thông hiểu':'TH','vận dụng cao':'VDC'};
function lvName(l,spec){const n=LV[l].trim();if(!S.tpl.abbr||(spec&&!/\s/.test(n)))return n;return ABBR[n.toLowerCase()]||n.split(/\s+/).map(w=>w[0]).join('').toUpperCase()}
const FILL={mcq:'FBE4D5',tf:'C5E0B3',short:'E4DFEC',essay:'FFF2CC',total:'DEEAF6',head:'F4B083'};
/* Một bảng = {w: tỉ lệ độ rộng cột, rows: [{cells:[{t,cs,rs,b,h,al,f}]}], head: số dòng tiêu đề}; dùng chung cho xem trước, sao chép và file Word.
   Mỗi bài một dòng riêng; chỉ TT, Phân môn, Chương được gộp dọc, nên khung không bị lệch. */
function buildTable(spec){
  const T=S.tpl,nm=numMap(),split=T.split,groups=tplTypes();
  const mode=spec?T.sCell:T.mCell,totMode=(mode==='qnum'||mode==='countq')?'count':mode;
  const tot=spec?T.total&&T.sTotal!==false:T.total,pct=T.percent&&!spec,col=T.color&&!spec,subj=T.subjCol&&!spec;
  const tn=spec&&T.tnkq&&split&&groups.some(t=>t!=='essay');
  const fill=t=>col&&t?FILL[t]:'';
  const L=[{t:'TT',w:.9}];
  if(subj)L.push({t:'Phân môn',w:1});
  if(T.chapter)L.push({t:'Chương',w:spec?3:4.2});
  if(T.content||!T.chapter)L.push({t:'Nội dung / Đơn vị kiến thức',w:spec?2.5:3.9});
  if(spec)L.push({t:'Yêu cầu cần đạt',w:7.1});
  const hr=split?(tn?4:3):2,dataCols=groups.length*3,numW=spec?(mode!=="count"?1.6:.9):.82;
  const w=[...L.map(c=>c.w),...Array(dataCols).fill(numW),...Array(tot?(split?3:1):0).fill(spec?.85:.82),...(pct?[1.3]:[])];
  const H=(t,cs=1,rs=1,f='')=>({t,cs,rs,b:true,h:true,f});
  const tl=t=>(!spec&&T.tnkq&&t!=='essay'?'TNKQ\n':'')+TYN[t];
  const r1=L.map(c=>H(c.t,1,hr));
  r1.push(H('Mức độ đánh giá',dataCols,1,col?FILL.head:''));
  if(tot)r1.push(split?H('Tổng',3,hr-1,fill('total')):H('Tổng',1,hr,fill('total')));
  if(pct)r1.push(H('Tỉ lệ % điểm',1,hr));
  const rows=[{cells:r1}];
  if(tn){
    const obj=groups.filter(t=>t!=='essay');
    rows.push({cells:[H('TNKQ',obj.length*3),...(groups.includes('essay')?[H(TYN.essay,3,2)]:[])]});
    rows.push({cells:obj.map(t=>H(TYN[t],3))});
  }else if(split)rows.push({cells:groups.map(t=>H(tl(t),3,1,fill(t)))});
  rows.push({cells:[...groups.flatMap(t=>LV.map((_,l)=>H(lvName(l,spec),1,1,fill(t)))),...(tot&&split?LV.map((_,l)=>H(lvName(l,spec),1,1,fill('total'))):[])]});
  const lvCells=(us,md,b)=>{const c=[];groups.forEach(t=>[0,1,2].forEach(l=>c.push({t:cellText(us.filter(u=>(t==null||u.type===t)&&u.level===l),md,nm),b,f:fill(t)})));return c};
  const totCells=(us,md,b)=>!tot?[]:split?[0,1,2].map(l=>({t:cellText(us.filter(u=>u.level===l),md,nm),b,f:fill('total')})):[{t:cellText(us,md,nm),b,f:fill('total')}];
  const pctCell=us=>T.pctPts&&us.length?`${pctOf(us)}\n(${vn(sumU(us))}đ)`:pctOf(us);
  const G=grouped(),nBody=G.reduce((s,g)=>s+g.length,0);
  let tt=0,first=true;
  G.forEach(g=>{tt++;g.forEach((r,ri)=>{
    const us=units(r.qs),cells=[];
    if(!T.chapter||ri===0)cells.push({t:String(tt),rs:T.chapter?g.length:1});
    if(subj&&first)cells.push({t:T.phanMon||S.info.subject,rs:nBody,b:true});
    if(T.chapter&&ri===0)cells.push({t:r.chapter||'—',rs:g.length,al:'l',b:true});
    if(T.content||!T.chapter)cells.push({t:r.name,al:'l'});
    if(spec)cells.push({t:r.req,al:'l'});
    cells.push(...lvCells(us,mode),...totCells(us,totMode));
    if(pct&&!(subj&&T.pctPts))cells.push({t:pctCell(us)});
    else if(pct&&first)cells.push({t:pctCell(units(S.questions)),rs:nBody,b:true});
    rows.push({cells});first=false;
  })});
  const all=units(S.questions),lead=L.length,nb=rows.length;
  const foot=(label,md,last)=>rows.push({cells:[{t:label,cs:lead,b:true},...lvCells(all,md,true),...totCells(all,md,true),...(pct?[{t:last,b:true}]:[])]});
  foot('Tổng số câu','count',pct?String(all.length):'');
  if(!spec||T.sFoot){
    foot('Tổng số điểm','points',vn(sumU(all)));
    if(T.footMerge&&split&&!spec)rows.push({cells:[{t:'Tỉ lệ %',cs:lead,b:true},...groups.map(t=>({t:pctOf(all.filter(u=>u.type===t)).replace('%',''),cs:3,b:true,f:fill(t)})),...totCells(all,'pct',true).map(c=>({...c,t:c.t.replace('%','')})),...(pct?[{t:pctOf(all),b:true}]:[])]});
    else foot('Tỉ lệ %','pct',pctOf(all));
  }
  return {w,rows,head:hr,foot:rows.length-nb};
}
const subtitle=()=>`Môn: ${S.info.subject||'…'} – Lớp ${S.info.grade||'…'} – Thời gian làm bài: ${S.info.duration} phút`;
function schoolTitle(){return `${up(S.tpl.docTitle||'Khung ma trận và đặc tả')} ${up(String(S.info.title).replace(/^\s*kiểm tra\s*/i,''))}`.trim()}
function schoolSub(){const T=S.tpl,i=S.info;return `MÔN ${up(i.subject||'…')}, LỚP ${i.grade||'…'}${T.phanMon?` (phân môn ${T.phanMon})`:''}`}
function docParts(){const T=S.tpl;return [T.include!=='spec'&&['m',T.orientM],T.include!=='matrix'&&['s',T.orientS]].filter(Boolean)}
const INTRO_NAME={mcq:'Trắc nghiệm nhiều lựa chọn',tf:'Trắc nghiệm Đúng/Sai',short:'Trắc nghiệm trả lời ngắn'};
function introBlocks(){
  const T=S.tpl,i=S.info,U=units(S.questions),by=t=>U.filter(u=>u.type===t);
  const objT=TYK.filter(t=>t!=='essay'&&by(t).length),es=by('essay');
  const lvTxt=us=>[0,1,2].map(l=>[l,us.filter(u=>u.level===l).length]).filter(x=>x[1]).map(([l,n])=>`${LV[l]}: ${n} câu`).join(', ');
  const each=us=>new Set(us.map(u=>Math.round(u.pts*100))).size===1?` – mỗi câu ${vn(us[0].pts)} điểm`:'';
  const L=(lv,t)=>({k:'p',runs:[[t,{}]],ind:lv,after:20});
  const B=[L(1,`- Thời điểm kiểm tra: ${i.title}.`)];
  if(T.scope)B.push(L(2,`+ ${T.scope}`));
  B.push(L(1,`- Thời gian làm bài: ${i.duration} phút.`));
  B.push(L(1,`- Hình thức kiểm tra: ${objT.length&&es.length?'Kết hợp giữa trắc nghiệm và tự luận':objT.length?'Trắc nghiệm':'Tự luận'}.`));
  B.push(L(1,'- Cấu trúc:'));
  if(objT.length){
    B.push(L(2,`+ Phần trắc nghiệm: ${vn(sumU(objT.flatMap(by)))} điểm`));
    objT.forEach(t=>{const us=by(t);B.push(L(3,`• ${INTRO_NAME[t]}: ${us.length} câu (${vn(sumU(us))} điểm) – ${lvTxt(us)}${each(us)}.`))});
  }
  if(es.length)B.push(L(2,`+ Phần tự luận: ${es.length} câu (${lvTxt(es)}) – ${vn(sumU(es))} điểm.`));
  B[B.length-1].after=120;
  return B;
}
/* Mỗi phần (ma trận / đặc tả) = danh sách khối, dựng ra HTML hoặc Word */
function docBlocks(k,i,n){
  const T=S.tpl,B=[];
  if(T.school){
    if(i===0)B.push({k:'schoolHead'},{k:'p',runs:[[schoolTitle(),{b:true}]],al:'c',before:240,big:true},{k:'p',runs:[[schoolSub(),{b:true}]],al:'c',after:160});
    B.push({k:'p',runs:[[`${i+1}. ${k==='m'?T.mTitle:T.sTitle}`,{b:true}]],ind:1,before:120,after:60});
    if(k==='m'&&T.intro)B.push(...introBlocks());
    if(k==='s'&&T.phanMon)B.push({k:'p',runs:[[`${i+1}.1. Phân môn ${T.phanMon}`,{b:true}]],ind:1,after:80});
  }else{
    if(i===0)B.push({k:'head'});
    B.push({k:'p',runs:[[up(k==='m'?T.mTitle:T.sTitle),{b:true}]],al:'c',before:240,after:20,big:true},{k:'p',runs:[[subtitle(),{i:true}]],al:'c',after:160});
  }
  B.push({k:'tbl',m:buildTable(k==='s')});
  if(i===n-1&&T.sign)B.push({k:'sign'});
  return B;
}
function htmlTable(m,font){
  const tw=m.w.reduce((a,b)=>a+b,0),gray=!S.tpl.color;
  return `<table style="border-collapse:collapse;width:100%;font-family:'Times New Roman',Times,serif;font-size:${font}pt;line-height:1.3;color:#000"><colgroup>${m.w.map(w=>`<col style="width:${(w/tw*100).toFixed(2)}%">`).join('')}</colgroup>${m.rows.map(r=>`<tr>${r.cells.map(c=>{const bg=c.f?'#'+c.f:c.h&&gray?'#f2f2f2':'';return `<td${c.cs>1?` colspan="${c.cs}"`:''}${c.rs>1?` rowspan="${c.rs}"`:''} style="border:1px solid #000;padding:2pt 4pt;vertical-align:middle;text-align:${c.al==='l'?'left':'center'};${c.b?'font-weight:bold;':''}${bg?`background:${bg};`:''}">${c.pre?`<b>${esc(c.pre)}</b> `:''}${cbr(c.t)}</td>`}).join('')}</tr>`).join('')}</table>`;
}
const signDate=()=>`${S.tpl.place?S.tpl.place+', ':'……………, '}ngày …… tháng …… năm 20……`;
function signCols(){
  const T=S.tpl,n=T.signs.length;
  return T.signs.map(([l,nm],k)=>{
    const L=[];
    if(T.dateInCol)L.push(k===n-1?[signDate(),{i:true}]:['',{}]);
    L.push([l,{b:true}]);
    if(T.signNote)L.push(['(Ký, ghi rõ họ tên)',{i:true}]);
    L.push(['',{}],['',{}],['',{}],[nm,{b:true}]);
    return L;
  });
}
function signHTML(){
  const T=S.tpl,cols=signCols();
  return (T.dateInCol?'':`<p style="margin:14pt 0 4pt;text-align:right;${SH}"><i>${esc(signDate())}</i></p>`)+`<table style="width:100%;border-collapse:collapse;margin-top:${T.dateInCol?14:0}pt;${SH}"><tr>${cols.map(L=>`<td style="width:${(100/cols.length).toFixed(1)}%;text-align:center;vertical-align:top;padding:0 6pt">${L.map(([t,f])=>(f.b?'<b>':'')+(f.i?'<i>':'')+(esc(t)||'&nbsp;')+(f.i?'</i>':'')+(f.b?'</b>':'')).join('<br>')}</td>`).join('')}</tr></table>`;
}
function blocksToHTML(B){
  const T=S.tpl,i=S.info;
  return B.map(b=>{
    if(b.k==='head')return sheetHeader(null);
    if(b.k==='schoolHead')return `<table style="width:46%;border-collapse:collapse;${SH}"><tr><td style="text-align:center;padding:0">${i.dept?esc(up(i.dept))+'<br>':''}<b>${esc(up(i.school))}</b></td></tr></table>`;
    if(b.k==='p')return `<p style="margin:${(b.before||0)/20}pt 0 ${(b.after??40)/20}pt ${(b.ind||0)*18}pt;text-align:${b.al==='c'?'center':'left'};${SH}${b.big?';font-size:14pt':''}">${runsHTML(b.runs)}</p>`;
    if(b.k==='tbl')return htmlTable(b.m,T.font);
    if(b.k==='sign')return signHTML();
    return '';
  }).join('');
}
function partHTML(k){const p=docParts(),i=p.findIndex(x=>x[0]===k);return `<div style="${SH}">${blocksToHTML(docBlocks(k,i,p.length))}</div>`}
function matrixHTML(){return docParts().map(([k])=>partHTML(k)).join('<br clear="all" style="page-break-before:always">')}

/* ---------- file Word (.docx) ---------- */
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function oxP(text,{b=false,i=false,al='c',sz=0,before=0,after=0,kn=false}={}){
  return String(text??'').split('\n').map(line=>`<w:p><w:pPr>${kn?'<w:keepNext/>':''}<w:spacing w:before="${before}" w:after="${after}"/><w:jc w:val="${al==='l'?'left':al==='r'?'right':'center'}"/></w:pPr>${line?oxRun(line,{b,i},sz):''}</w:p>`).join('');
}
const NOB=['top','left','bottom','right','insideH','insideV'];
function oxPlain(cols,W,fr){
  const ws=cols.map((_,k)=>Math.floor(W*(fr?fr[k]:1/cols.length)));
  return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders>${NOB.map(k=>`<w:${k} w:val="nil"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${ws.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid><w:tr><w:trPr><w:cantSplit/></w:trPr>${cols.map((c,k)=>`<w:tc><w:tcPr><w:tcW w:w="${ws[k]}" w:type="dxa"/></w:tcPr>${c||'<w:p/>'}</w:tc>`).join('')}</w:tr></w:tbl>`;
}
function oxTable(m,W,sz,keepLast=false){
  const tw=m.w.reduce((a,b)=>a+b,0),cols=m.w.map(w=>Math.floor(w/tw*W)),nc=cols.length,pend=new Array(nc).fill(null),gray=!S.tpl.color;
  const span=(c,cs)=>cols.slice(c,c+cs).reduce((a,b)=>a+b,0);
  const shd=f=>f?`<w:shd w:val="clear" w:color="auto" w:fill="${f}"/>`:'';
  let x=`<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${NOB.map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="57" w:type="dxa"/><w:right w:w="57" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${cols.map(c=>`<w:gridCol w:w="${c}"/>`).join('')}</w:tblGrid>`;
  m.rows.forEach((row,ri)=>{
    let col=0,k=0,cells='';
    const kn=(m.keep&&ri<m.rows.length-1)||(!!m.foot&&ri>=m.rows.length-m.foot-1&&(ri<m.rows.length-1||keepLast)); /* dòng cuối và các dòng tổng không tách trang */
    while(col<nc){
      const p=pend[col];
      if(p&&p.rem>0){cells+=`<w:tc><w:tcPr><w:tcW w:w="${span(col,p.cs)}" w:type="dxa"/>${p.cs>1?`<w:gridSpan w:val="${p.cs}"/>`:''}<w:vMerge/>${p.shade}<w:vAlign w:val="center"/></w:tcPr>${kn?"<w:p><w:pPr><w:keepNext/></w:pPr></w:p>":"<w:p/>"}</w:tc>`;p.rem--;col+=p.cs;continue}
      const c=row.cells[k++];if(!c)break;
      const cs=c.cs||1,rs=c.rs||1,shade=shd(c.f||(c.h&&gray?'F2F2F2':''));
      pend[col]=rs>1?{rem:rs-1,cs,shade}:null;
      cells+=`<w:tc><w:tcPr><w:tcW w:w="${span(col,cs)}" w:type="dxa"/>${cs>1?`<w:gridSpan w:val="${cs}"/>`:''}${rs>1?'<w:vMerge w:val="restart"/>':''}${shade}<w:vAlign w:val="center"/></w:tcPr>${c.pre?oxRP([[c.pre,{b:true}],[' '+c.t,{}]],{al:c.al||'c',sz,before:10,after:10}):oxP(c.t,{b:c.b,al:c.al||'c',sz,before:10,after:10,kn})}</w:tc>`;
      col+=cs;
    }
    x+=`<w:tr><w:trPr><w:cantSplit/>${ri<m.head?'<w:tblHeader/>':''}</w:trPr>${cells}</w:tr>`;
  });
  return x+'</w:tbl>';
}
function oxHead(W,sz){
  const i=S.info;
  const L=(i.dept?oxP(up(i.dept),{sz}):'')+oxP(up(i.school),{b:true,sz})+(i.group?oxP(i.group,{sz}):'');
  const R=oxP(up(i.title),{b:true,sz})+oxP(`Năm học ${i.year}`,{sz});
  return oxPlain([L,R],W,[.42,.58]);
}
function oxSign(W,sz){
  const T=S.tpl;
  return (T.dateInCol?oxP('',{before:120,kn:true}):oxP(signDate(),{i:true,al:'r',sz,before:240,after:60,kn:true}))+oxPlain(signCols().map(L=>L.map(([t,f])=>oxP(t,{b:f.b,i:f.i,sz})).join('')),W);
}
function blocksToOx(B,W){
  const T=S.tpl,i=S.info;let x='';
  B.forEach((b,bi)=>{
    let s='';
    if(b.k==='head')s=oxHead(W,26);
    else if(b.k==='schoolHead')s=oxPlain([(i.dept?oxP(up(i.dept),{sz:26}):'')+oxP(up(i.school),{b:true,sz:26}),''],W,[.46,.54]);
    else if(b.k==='p')s=oxRP(b.runs,{al:b.al||'l',ind:(b.ind||0)*360,before:b.before||0,after:b.after??40,sz:b.big?28:26});
    else if(b.k==='tbl')s=oxTable(b.m,W,T.font*2,(B[bi+1]||{}).k==='sign');
    else if(b.k==='sign')s=oxSign(W,26);
    if(x.endsWith('</w:tbl>')&&s.startsWith('<w:tbl>'))x+='<w:p/>';
    x+=s;
  });
  return x;
}
async function buildDocx(){
  if(!window.JSZip)throw new Error('nolib');
  const parts=docParts(),mar={t:851,r:1134,b:709,l:1134};
  const sectPr=o=>{const L=o==='landscape';return `<w:sectPr><w:pgSz w:w="${L?16838:11906}" w:h="${L?11906:16838}"${L?' w:orient="landscape"':''}/><w:pgMar w:top="${mar.t}" w:right="${mar.r}" w:bottom="${mar.b}" w:left="${mar.l}" w:header="459" w:footer="459" w:gutter="0"/></w:sectPr>`};
  let body='',last='';
  parts.forEach(([k,o],i)=>{
    const W=(o==='landscape'?16838:11906)-mar.l-mar.r;
    body+=blocksToOx(docBlocks(k,i,parts.length),W);
    if(i<parts.length-1)body+=`<w:p><w:pPr>${sectPr(o)}</w:pPr></w:p>`;else last=sectPr(o);
  });
  return makeDocx(body+'<w:p/>'+last);
}
function makeDocx(inner){
  const XH='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"',REL='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const zip=new JSZip();
  zip.file('[Content_Types].xml',`${XH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  zip.file('_rels/.rels',`${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file('word/_rels/document.xml.rels',`${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/styles" Target="styles.xml"/></Relationships>`);
  zip.file('word/styles.xml',`${XH}<w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="26"/><w:szCs w:val="26"/><w:lang w:val="vi-VN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`);
  zip.file('word/document.xml',`${XH}<w:document ${NS}><w:body>${inner}</w:body></w:document>`);
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function oxRun(t,f,sz){
  const rp=sub=>`<w:rPr>${f.b?'<w:b/>':''}${f.i?'<w:i/>':''}${sz?`<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`:''}${f.u?'<w:u w:val="single"/>':''}${f.box?'<w:bdr w:val="single" w:sz="4" w:space="1" w:color="000000"/>':''}${sub?'<w:vertAlign w:val="subscript"/>':''}</w:rPr>`;
  return String(t??'').split('\n').map(l=>chemParts(l).map(([x,sub])=>`<w:r>${rp(sub)}<w:t xml:space="preserve">${xe(x)}</w:t></w:r>`).join('')).join(`<w:r>${rp(false)}<w:br/></w:r>`);
}
function oxRP(runs,{al='l',ind=0,before=0,after=40,sz=0,kn=false}={}){
  return `<w:p><w:pPr>${kn?'<w:keepNext/>':''}<w:spacing w:before="${before}" w:after="${after}"/>${ind?`<w:ind w:left="${ind}"/>`:''}<w:jc w:val="${al==='c'?'center':al==='r'?'right':'left'}"/></w:pPr>${runs.map(r=>r.fld?`<w:fldSimple w:instr=" ${r.fld} " w:dirty="true"><w:r><w:rPr>${r.i?'<w:i/>':''}${sz?`<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`:''}</w:rPr><w:t>1</w:t></w:r></w:fldSimple>`:oxRun(r[0],r[1]||{},sz)).join('')}</w:p>`;
}
function oxOpts(b,W,sz){
  if(b.cols===1)return b.items.map(([l,t])=>oxRP([[l,{b:true}],[' '+t,{}]],{ind:360,sz})).join('');
  const Wt=W-360,cw=Math.floor(Wt/b.cols),rows=[];
  for(let k=0;k<b.items.length;k+=b.cols)rows.push(b.items.slice(k,k+b.cols));
  return `<w:tbl><w:tblPr><w:tblW w:w="${Wt}" w:type="dxa"/><w:tblInd w:w="360" w:type="dxa"/><w:tblBorders>${NOB.map(k=>`<w:${k} w:val="nil"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="57" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${Array(b.cols).fill(`<w:gridCol w:w="${cw}"/>`).join('')}</w:tblGrid>${rows.map(r=>`<w:tr>${Array.from({length:b.cols},(_,k)=>`<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/></w:tcPr>${r[k]?oxRP([[r[k][0],{b:true}],[' '+r[k][1],{}]],{sz,after:20}):'<w:p/>'}</w:tc>`).join('')}</w:tr>`).join('')}</w:tbl>`;
}
function oxExamHead(code,W,sz){
  const i=S.info,X=S.etpl;
  let L=(i.dept?oxP(String(i.dept).toUpperCase(),{sz}):'')+oxP(String(i.school).toUpperCase(),{b:true,sz})+(i.group?oxP(i.group,{sz}):'');
  if(X.official)L+=oxRP([['ĐỀ CHÍNH THỨC',{b:true,box:true}]],{al:'c',before:120,sz});
  if(X.pages)L+=oxRP([['(Đề có ',{i:true}],{fld:'SECTIONPAGES',i:true},[' trang)',{i:true}]],{al:'c',sz});
  const R=oxP(String(i.title).toUpperCase(),{b:true,sz})+oxP(`Môn: ${i.subject||'…'} – Lớp ${i.grade||'…'}`,{b:true,sz})+oxP(`Năm học ${i.year}`,{sz})+oxP(`Thời gian làm bài: ${i.duration} phút, không kể thời gian phát đề`,{i:true,sz});
  const info='Họ và tên học sinh: ................................................ Lớp: ..........'+(X.sbd?'\nSố báo danh: ....................':'');
  return oxPlain([L,R],W,[.42,.58])+oxP('',{})+oxPlain([oxRP([[info,{}]],{sz,before:60}),X.codeBox?oxRP([[` Mã đề ${code} `,{b:true,box:true}]],{al:'r',sz,before:60}):''],W,[.75,.25]);
}
async function buildExamDocx(list){
  if(!window.JSZip)throw new Error('nolib');
  const X=S.etpl,sz=X.font*2,L=X.orient==='landscape',dp=X.partStyle==='dp',mar=dp?{t:567,r:454,b:567,l:567}:{t:1134,r:851,b:1134,l:1134},W=(L?16838:11906)-mar.l-mar.r;
  const sect=`<w:sectPr><w:pgSz w:w="${L?16838:11906}" w:h="${L?11906:16838}"${L?' w:orient="landscape"':''}/><w:pgMar w:top="${mar.t}" w:right="${mar.r}" w:bottom="${mar.b}" w:left="${mar.l}" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr>`;
  let body='';
  list.forEach((code,ci)=>{
    examBlocks(code).forEach(b=>{
      const s=b.k==='head'?(dp?oxExamHeadDp(code,W,sz):oxExamHead(code,W,sz)):b.k==='tbl'?oxTable(b.m,b.wf?Math.floor(W*b.wf):W,sz):b.k==='p'?oxRP(b.runs,{al:b.al,ind:b.ind?360:0,before:b.before||0,after:b.after??40,sz,kn:!!b.kn}):b.k==='sheet'?oxSheet(b.v,W,sz):b.k==='gv'?oxGv(W,sz):b.k==='pb'?'<w:p><w:r><w:br w:type="page"/></w:r></w:p>':b.k==='keyHead'?oxKeyHead(W,sz):oxOpts(b,W,sz);
      if(body.endsWith('</w:tbl>')&&s.startsWith('<w:tbl>'))body+='<w:p/>';
      body+=s;
    });
    if(ci<list.length-1)body+=`<w:p><w:pPr>${sect}</w:pPr></w:p>`;
  });
  return makeDocx(body+'<w:p/>'+sect);
}

async function examDocx(b,list,tag){
  b.disabled=true;
  try{const blob=await buildExamDocx(list);await saveFile(`De ${S.info.subject||''} ${S.info.grade||''} - ${tag}`.replace(/\s+/g,' ').replace(/[\\/:*?"<>|]/g,'-')+'.docx',blob)}
  catch(_){toast('Không tạo được file Word. Kiểm tra kết nối mạng rồi thử lại.')}
  finally{b.disabled=false}
}
async function saveFile(name,blob){
  let dl=null;
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(_){dl=null}
  if(dl){
    try{const r=await dl.save({filename:name,data:blob});if(r&&r.status==='saved')toast('Đã tải '+name)}
    catch(e){const c=e&&e.code;toast(c==='declined'?'Đã hủy tải file.':c==='rate_limited'?'Đang có một hộp thoại tải file, thử lại sau giây lát.':'Không tải được file ở chế độ xem này. Hãy dùng nút Sao chép sang Word.')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Đã tải '+name);
}

   Chỉ nêu những dạng câu có trong ma trận (không dùng trả lời ngắn thì không nhắc tới). */
const isBlankQ=q=>!String(q.stem||'').trim()&&(q.type!=='mcq'||q.options.every(o=>!String(o).trim()))&&(q.type!=='tf'||q.tf.every(x=>!String(x.text).trim()))&&!String(q.short||'').trim()&&!String(q.essay||'').trim();
const tfLv=(q,k)=>{const x=q.tf[k]||{};return (x.level===0||x.level)?+x.level:q.level};
const topicReq=(name,lvs)=>{const t=S.topics.find(x=>x.name===name);if(!t||!t.req)return '';
  const ls=t.req.split(/\n+/).map(x=>x.trim()).filter(Boolean),names=[...new Set(lvs||[])].map(l=>String(LV[l]||'').toLowerCase());
  const pick=ls.filter(x=>names.some(n=>n&&x.toLowerCase().startsWith(n)));
  return (pick.length?pick:ls).join(' ')};
function aiPlan(){
  /* các "ô câu hỏi" cần soạn, theo thứ tự đánh số của đề */
  const nm=numMap(),slots=[];
  let n=0;const next=()=>++n;
  const empty=TYK.flatMap(t=>byType(t)).filter(isBlankQ);
  const a0=actual(),full=S.questions.length&&TYK.every(t=>[0,1,2].every(l=>a0[t][l]>=(+S.target[t][l]||0)));
  if(empty.length||full){
    TYK.forEach(t=>byType(t).forEach(q=>{
      const each=t==='tf'&&S.tfEach;
      const num=each?q.tf.map((_,k)=>nm[q.id+':'+k]):[nm[q.id]];
      if(isBlankQ(q)||!empty.length)slots.push({t,q,num:num.map(x=>x||next()),lv:each?q.tf.map((_,k)=>tfLv(q,k)):[q.level],topic:q.topic,pts:qp(q)});
    }));
    /* số thứ tự lấy theo đề nếu có, nếu không thì đánh liên tục */
    if(slots.some(s=>s.num.some(x=>!x))){n=0;slots.forEach(s=>s.num=s.num.map(next))}
    return slots;
  }
  /* chưa có ô câu hỏi: dựa vào số câu còn thiếu trong ma trận */
  const a=actual();let need=TYK.map(t=>[t,[0,1,2].map(l=>Math.max(0,(+S.target[t][l]||0)-a[t][l]))]);
  if(!need.some(([,v])=>v.some(Boolean)))need=TYK.map(t=>[t,[0,1,2].map(l=>+S.target[t][l]||0)]);
  n=units(S.questions).length;
  const noShort=S.tpl.preset==='dp'&&!byType('short').length;
  need.forEach(([t,v])=>{if(t==='short'&&noShort)return;
    if(t==='tf'&&S.tfEach){const lv=[];v.forEach((c,l)=>{for(let i=0;i<c;i++)lv.push(l)});for(let i=0;i<lv.length;i+=4){const g=lv.slice(i,i+4);slots.push({t,num:g.map(next),lv:g,topic:'',pts:per('tf')*g.length})}}
    else v.forEach((c,l)=>{for(let i=0;i<c;i++)slots.push({t,num:[next()],lv:[l],topic:'',pts:+S.points[t]||0})});
  });
  return slots;
}

/* ---------- đọc văn bản câu hỏi ---------- */
const LEAD_RE=/^(?:câu dẫn|đoạn dẫn|đoạn thông tin|tình huống|thông tin chung)\s*(?:\([^)]*\))?\s*[:.\-–]?\s*(.*)$/i;
const RANGE_RE=/(?:từ\s+)?câu\s*\d+\s*(?:[-–]|đến)\s*(?:câu\s*)?\d+/i;
const SEC_RE=/^(?:PHẦN\s+[IVX\d]+|[IVX]+\.|[AB]\.\s*(?:PHẦN|TRẮC|TỰ)|\d\.\s*(?:câu\s+)?(?:trắc nghiệm|tự luận))/i;
function parseText(txt,defLevel){
  const items=[];let cur=null,lead=null,leadOpen=false,sec='';
  txt.replace(/\r/g,'').replace(/\*\*|__/g,'').split('\n').forEach(raw=>{
    const line=raw.replace(/^\s*#+\s*/,'').trim();if(!line)return;
    let m=line.match(/^Câu\s*(\d+)\s*(?:\(([^)]*)\))?\s*[.:)\-–]?\s*(.*)$/i);
    if(m&&!RANGE_RE.test(line.slice(0,24))){cur={ls:[m[3]],hint:m[2]||'',lead,sec,no:+m[1]};items.push(cur);leadOpen=false;return}
    if(SEC_RE.test(line)&&line.length<220){sec=/tự luận/i.test(line)?'essay':/đúng\s*[\/–-]?\s*sai/i.test(line)?'tf':/nhiều lựa chọn/i.test(line)?'mcq':/trả lời ngắn/i.test(line)?'short':'';cur=null;lead=null;leadOpen=false;return}
    if((m=line.match(LEAD_RE))||RANGE_RE.test(line)){lead={text:[(m?m[1]:line).replace(/^(?:từ\s+)?câu\s*\d+\s*(?:[-–]|đến)\s*(?:câu\s*)?\d+\s*[.:)]?\s*/i,'')]};lead.text=lead.text.filter(Boolean);cur=null;leadOpen=true;return}
    if(/^Nội dung câu hỏi/i.test(line))return;
    if(sec==='tf'&&(!cur||/^[“"]/.test(line))&&!leadOpen){lead={text:[line.replace(/^[“"]|[”"]$/g,'')]};cur=null;leadOpen=true;return}
    if(leadOpen&&lead){lead.text.push(line);return}
    if(cur)cur.ls.push(line);
  });
  const qs=items.map(it=>{const q=parseBlock(it.ls,defLevel,it.hint,it.sec);q._lead=it.lead;q._no=it.no;return q});
  /* gom các nhận định Đúng/Sai liên tiếp (cùng câu dẫn) thành một câu dẫn 4 ý */
  const out=[];let grp=null;
  qs.forEach(q=>{
    if(q.type!=='tfs'){grp=null;delete q._lead;out.push(q);return}
    if(!grp||grp._lead!==q._lead||grp.tf.length>=4){
      grp=newQ('tf',q.level);grp._lead=q._lead;grp._no=q._no;grp.topic=q.topic;grp.tf=[];
      grp.stem=q._lead?q._lead.text.join('\n'):'';out.push(grp);
    }
    grp.tf.push(q._lv?{text:q.stem,ans:q._ans,level:q.level}:{text:q.stem,ans:q._ans});
    if(!grp.topic)grp.topic=q.topic;
  });
  out.forEach(q=>{if(q.type==='tf'){while(!S.tfEach&&q.tf.length<4)q.tf.push({text:'',ans:true});const L=q.tf.filter(x=>x.level!=null).map(x=>x.level);if(L.length){q.level=Math.min(...L);q._lv=1}}delete q._lead});
  return out;
}
const lvOf=v=>{v=String(v||'').toLowerCase();return /vận|vd/.test(v)?2:/hiểu|th\b|^h$/.test(v)?1:/biết|nb|^b$/.test(v)?0:null};
function parseBlock(ls,defLevel,hint='',sec=''){
  const q=newQ('short',defLevel);
  const stem=[],opts={},tfs={},tfLines=[],ans=[];let inAns=false,hasPts=false;
  const hl=lvOf(hint);if(hl!=null){q.level=hl;q._lv=1}
  ls.forEach(l=>{
    let m;
    if((m=l.match(/^(?:Đáp án|ĐA|Lời giải|Hướng dẫn chấm|Trả lời)\s*[:.]\s*(.*)$/i))){inAns=true;if(m[1])ans.push(m[1]);return}
    if((m=l.match(/^Mức độ\s*[:.]\s*(.*)$/i))){const v=lvOf(m[1]);if(v!=null){q.level=v;q._lv=1}inAns=false;return}
    if((m=l.match(/^(?:Chủ đề|Bài|Nội dung|Đơn vị kiến thức)\s*[:.]\s*(.*)$/i))){q.topic=matchTopic(m[1].trim());inAns=false;return}
    if((m=l.match(/^Điểm\s*[:.]\s*([\d.,]+)/i))){q.points=m[1].replace(',','.');hasPts=true;inAns=false;return}
    if(inAns){ans.push(l);return}
    if(/^\*?[A-D]\s*[.)]\s/.test(l)){
      l.split(/\s+(?=\*?[A-D][.)]\s)/).forEach(part=>{const mm=part.match(/^(\*?)([A-D])\s*[.)]\s*(.*)$/);if(mm){opts[mm[2]]=mm[3].trim();if(mm[1])q.answer=mm[2]}});
      return;
    }
    if((m=l.match(/^([a-d])\s*\)\s*(.*)$/))){tfs[m[1]]=m[2].trim();tfLines.push(l);return}
    stem.push(l);
  });
  let st=stem.join('\n').trim();
  const essayTag=/^[\[(]?\s*tự luận\s*[\])]?\s*[:.\-–]?\s*/i;
  const isEssay=essayTag.test(st)||/tự luận/i.test(hint)||sec==='essay';
  if(isEssay)st=st.replace(essayTag,'');
  q.stem=st;
  const a1=ans.join(' ').trim(),tfAns=a1.toLowerCase().replace(/[.\s]+$/,'');
  const shortUsed=tsum('short')>0||byType('short').length>0;
  if(Object.keys(opts).length>=2){
    q.type='mcq';q.options=[0,1,2,3].map(k=>opts[ABCD[k]]||'');
    const m=a1.match(/\b[A-D]\b/)||a1.match(/[A-D]/);if(m)q.answer=m[0];
  }else if(Object.keys(tfs).length>=2&&!isEssay&&!hasPts&&(sec==='tf'||tfToks(a1).length>=2||!ans.length)){
    q.type='tf';
    const toks=a1.split(/[\s,;]+/).map(t=>t.replace(/^[a-d]\)\s*/i,'').toLowerCase()).filter(t=>/^(đ|s|đúng|sai)$/.test(t));
    const ks=S.tfEach?Object.keys(tfs).sort():[...abcd];
    q.tf=ks.map((c,k)=>({text:tfs[c]||'',ans:toks[k]?toks[k].startsWith('đ'):true}));
  }else if((/^(đ|s|đúng|sai)$/.test(tfAns)||(sec==='tf'&&!ans.length))&&!isEssay){
    q.type='tfs';q._ans=tfAns?tfAns.startsWith('đ'):true; /* một nhận định Đúng/Sai tính là một câu */
  }else if(isEssay||hasPts||tfLines.length>=2||!shortUsed||a1.length>12||ans.length>1){
    q.type='essay';q.essay=ans.join('\n');
    if(tfLines.length)q.stem=[st,...tfLines].filter(Boolean).join('\n'); /* ý a), b) của câu tự luận */
  }else{
    q.type='short';q.short=a1;
  }
  return q;
}
const tfToks=a=>a.split(/[\s,;]+/).map(t=>t.replace(/^[a-d]\)\s*/i,'').toLowerCase()).filter(t=>/^(đ|s|đúng|sai)$/.test(t));
/* tên bài AI ghi → đúng tên bài trong bản đặc tả */
function matchTopic(s){
  const norm=x=>String(x).toLowerCase().replace(/[.\s]+/g,' ').trim();
  const num=x=>(String(x).match(/bài\s*(\d+)/i)||[])[1];
  const T=S.topics.filter(t=>t.name);
  return (T.find(t=>norm(t.name)===norm(s))||(num(s)&&T.find(t=>num(t.name)===num(s)))||T.find(t=>norm(s).includes(norm(t.name))||norm(t.name).includes(norm(s)))||{name:s}).name;
}
/* điền câu đã đọc vào đúng ô trống của ma trận (cùng dạng, mức độ, bài); không có ô thì thêm mới */
function placeParsed(list){
  let filled=0,added=0,replaced=0;const nm=numMap(),at={};S.questions.forEach(q=>{const k=q.type==='tf'&&S.tfEach?nm[q.id+':0']:nm[q.id];if(k)at[k]=q});
  list.forEach(p=>{
    const free=S.questions.filter(q=>q.type===p.type&&isBlankQ(q));
    const tl=q=>q.type==='tf'?q.tf.map((_,k)=>tfLv(q,k)).join():String(q.level);
    const pl=p.type==='tf'?p.tf.map(x=>x.level??'?').join():p._lv?String(p.level):'?';
    const lvOk=q=>{const a=tl(q).split(','),b=pl.split(',');return a.every((x,k)=>b[k]==='?'||b[k]==null||String(b[k])===x)};
    const slot=free.find(q=>q.topic===p.topic&&lvOk(q))||free.find(lvOk)||free.find(q=>q.topic===p.topic)||free[0];
    if(!slot){
      const old=p._no&&at[p._no];delete p._no;
      if(old&&old.type===p.type){const keep2={id:old.id,topic:p.topic&&S.topics.some(t=>t.name===p.topic)?p.topic:old.topic||p.topic,points:p.points||old.points};
        if(p.type==='tf')p.tf=p.tf.map((x,k)=>({...x,level:x.level??tfLv(old,k)}));if(!p._lv)keep2.level=old.level;delete p._lv;Object.assign(old,p,keep2);replaced++;return}
      delete p._lv;S.questions.push(p);added++;return}
    const keep={id:slot.id,topic:p.topic&&S.topics.some(t=>t.name===p.topic)?p.topic:slot.topic||p.topic,points:p.points||slot.points};
    if(p.type==='tf')p.tf=p.tf.map((x,k)=>({...x,level:x.level??tfLv(slot,k)}));
    if(!p._lv)keep.level=slot.level;
    delete p._lv;delete p._no;Object.assign(slot,p,keep);filled++;
  });
  return {filled,added,replaced};
}

/* ---------- các màn hình ---------- */
function steps(){
  const iss=issues().filter(x=>x.sev==='err').length;

V.matrix=()=>{

      const tg=+S.target[t][l]||0,h=a[t][l];const c=h===tg?'ok':h<tg?'short':'over';
      return `<td class="num"><input id="t-${t}-${l}" class="cell" type="number" min="0" max="200" data-target="${t}:${l}" value="${tg}" aria-label="${TY[t]} ${LV[l]}"><span class="have ${tg||h?c:''}">có ${h}</span></td>`}).join('')}

    <td class="num">${vn(tsum(t)*per(t))}</td></tr>`).join('');
  const topics=S.topics.map((t,i)=>`<div class="topic-row"><input id="tp-${i}-c" data-topic="${i}:chapter" value="${esc(t.chapter)}" placeholder="Chương / chủ đề" aria-label="Chương / chủ đề"><input id="tp-${i}-n" data-topic="${i}:name" value="${esc(t.name)}" placeholder="Nội dung, ví dụ: Phân số" aria-label="Nội dung"><textarea id="tp-${i}-r" class="req" rows="2" data-topic="${i}:req" placeholder="Yêu cầu cần đạt, ví dụ: Biết: …; Hiểu: …; Vận dụng: …" aria-label="Yêu cầu cần đạt">${esc(t.req)}</textarea><button class="btn small danger" data-act="del-topic" data-i="${i}">Xóa</button></div>`).join('');

  <section class="card"><div class="card-head"><h2>Số câu và điểm</h2>
    <span class="pill ${okScore?'ok':'warn'}">Điểm theo ma trận: ${fmt(tp)} / ${fmt(score)}</span>
    ${dp?'':'<button class="btn small" data-act="preset">Dùng cấu trúc 2025 (12 · 4 · 6)</button>'}</div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Dạng câu</th>${LV.map(l=>`<th class="num">${l}</th>`).join('')}<th class="num">Số câu</th><th class="num">Điểm / câu</th><th class="num">Điểm</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><th>Tổng số điểm</th>${lvPts.map(x=>`<td class="num">${vn(x)}</td>`).join('')}<td class="num">${TYK.reduce((s,t)=>s+tsum(t),0)}</td><td></td><td class="num">${vn(tp)}</td></tr><tr><th>Tỉ lệ %${+S.tpl.pctBase?` <span class="small muted">(trên ${S.tpl.pctBase} điểm)</span>`:''}</th>${lvPts.map(x=>`<td class="num">${pc(x)}</td>`).join('')}<td></td><td></td><td class="num">${pc(tp)}</td></tr></tfoot></table></div>
    <label class="check"><input type="checkbox" id="m-tfEach" data-flag="tfEach" ${S.tfEach?'checked':''}>Đúng/Sai: mỗi ý tính là một câu, đánh số tiếp theo trắc nghiệm (mẫu trường)</label>
    <p class="hint">${S.tfEach?`Mỗi ý Đúng/Sai được ${vn(per('tf'))} điểm; mỗi câu dẫn có 2–4 ý (chọn khi soạn). Mức độ có thể đặt riêng cho từng ý khi soạn.`:`Câu đúng/sai chấm theo số ý trả lời đúng: 1 ý ${tfRule()[0]}, 2 ý ${tfRule()[1]}, 3 ý ${tfRule()[2]}, 4 ý ${tfRule()[3]} điểm.`} Câu tự luận có thể đặt điểm riêng khi soạn.</p>
  </section>
  <section class="card"><div class="card-head"><h2>Chủ đề và yêu cầu cần đạt</h2><button class="btn small" data-act="add-topic">＋ Thêm chủ đề</button></div>
    ${topics?'<div class="topic-row topic-head small muted"><span>Chương</span><span>Nội dung (gắn cho câu hỏi)</span><span>Yêu cầu cần đạt</span><span></span></div>'+topics:'<p class="muted">Chưa có chủ đề. Thêm chủ đề để gắn cho từng câu và lập bản đặc tả; câu lệnh gửi AI cũng bám theo đây.</p>'}

    <div class="table-wrap"><table class="t"><thead><tr><th>Chủ đề</th>${LV.map(l=>`<th class="num">${l}</th>`).join('')}<th class="num">Tổng</th></tr></thead>
    <tbody>${spec.length?spec.map(r=>`<tr><td>${esc(r.name)}${r.req?`<div class="small muted">${esc(r.req)}</div>`:''}</td>${r.c.map(x=>`<td class="num">${x||'–'}</td>`).join('')}<td class="num"><b>${r.c.reduce((x,y)=>x+y,0)}</b></td></tr>`).join(''):`<tr><td colspan="5" class="muted">Chưa có câu hỏi.</td></tr>`}</tbody></table></div>

function qBody(q){
  if(q.type==='mcq')return `<ol class="opts">${q.options.map((o,j)=>`<li class="${q.answer===ABCD[j]?'right':''}"><b>${ABCD[j]}.</b> ${esc(o)||'<span class="muted">(trống)</span>'}</li>`).join('')}</ol>`;
  if(q.type==='tf')return `<div class="tf">${q.tf.map((x,j)=>`<div><span class="ds ${x.ans?'d':'s'}">${x.ans?'Đ':'S'}</span><span>${abcd[j]}) ${esc(x.text)||'<span class="muted">(trống)</span>'}</span></div>`).join('')}</div>`;
  if(q.type==='short')return `<p class="ans">Đáp án: <b>${esc(q.short)||'—'}</b></p>`;
  return `<details><summary>Hướng dẫn chấm</summary><p class="stem small">${esc(q.essay)||'Chưa có'}</p></details>`;
}
V.questions=()=>{
  const flagged=new Set(issues().filter(x=>x.sev==='err').map(x=>x.id));

    ${qs.map((q,k)=>`<article class="q ${flagged.has(q.id)?'flag':''}"><div class="q-head"><span class="qno">Câu ${k+1}</span><span class="tag lv${q.level}">${LV[q.level]}</span>${q.topic?`<span class="tag">${esc(q.topic)}</span>`:''}<span class="tag">${fmt(qp(q))} đ</span><span class="grow"></span>

  <section class="card"><div class="row">
    <button class="btn primary" data-act="add">＋ Thêm câu hỏi</button>
    <button class="btn" data-act="import">Dán đề có sẵn / kết quả AI</button>
    <button class="btn" data-act="ai">Soạn câu lệnh cho AI</button>
    <span class="grow"></span><span class="pill">${S.questions.length} câu · ${fmt(totalPts())} / ${fmt(+S.info.score)} điểm</span></div>
    <div class="filters">${[['all','Tất cả'],...TYK.map(t=>[t,TY[t]])].map(([k,l])=>`<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
  </section>

  ${S.questions.length?'<div class="row"><button class="btn primary" data-act="go" data-v="review">Tiếp: Kiểm tra đề →</button></div>':''}`;
};
V.review=()=>{
  const a=actual(),iss=issues();
  const err=iss.filter(x=>x.sev==='err'),warn=iss.filter(x=>x.sev==='warn');
  const tgt=TYK.reduce((s,t)=>s+tsum(t),0),tp=totalPts(),score=+S.info.score||10;
  const okPts=Math.abs(tp-score)<1e-6;
  let diffs=[];TYK.forEach(t=>[0,1,2].forEach(l=>{const d=a[t][l]-(+S.target[t][l]||0);if(d)diffs.push({t,l,d})}));
  const mcq=byType('mcq');const dist=[0,0,0,0];mcq.forEach(q=>{const i=ABCD.indexOf(q.answer);if(i>=0)dist[i]++});
  const mx=Math.max(1,...dist);
  return `<div class="lead"><div class="eyebrow">Bước 4 / 5</div><h1>Kiểm tra đề</h1><p class="sub">Đề được đối chiếu với ma trận và soát lỗi hình thức. Độ đúng chuyên môn vẫn do thầy cô quyết định.</p></div>
  <div class="stats">
    <div class="stat ${units(S.questions).length===tgt?'ok':'warn'}"><span class="small muted">Số câu / mục tiêu</span><b>${units(S.questions).length} / ${tgt}</b></div>
    <div class="stat ${okPts?'ok':'bad'}"><span class="small muted">Tổng điểm</span><b>${fmt(tp)} / ${fmt(score)}</b></div>
    <div class="stat ${err.length?'bad':'ok'}"><span class="small muted">Lỗi cần sửa</span><b>${err.length}</b></div>
    <div class="stat ${warn.length?'warn':'ok'}"><span class="small muted">Lưu ý</span><b>${warn.length}</b></div>
  </div>
  <div class="grid2">
  <section class="card"><h2>So với ma trận</h2>
    ${diffs.length?diffs.map(x=>`<div class="issue"><span class="sev ${x.d>0?'err':''}"></span><span class="what">${TY[x.t]} · ${LV[x.l]}</span><span class="pill ${x.d>0?'bad':'warn'}">${x.d>0?'thừa '+x.d:'thiếu '+(-x.d)}</span></div>`).join(''):'<p class="pill ok">Khớp ma trận</p>'}
    ${okPts?'':`<p class="hint">Tổng điểm các câu là ${fmt(tp)}, chưa bằng ${fmt(score)}. Chỉnh điểm mỗi câu ở bước Ma trận hoặc điểm riêng của câu tự luận.</p>`}
  </section>
  <section class="card"><h2>Phân bố đáp án nhiều lựa chọn</h2>
    ${mcq.length?`<div class="bars">${dist.map((n,i)=>`<div class="bar"><b>${ABCD[i]}</b><span><i style="width:${n/mx*100}%"></i></span><span>${n}</span></div>`).join('')}</div><p class="hint">Đây là đề gốc. Khi trộn phương án, mỗi mã đề sẽ có phân bố khác.</p>`:'<p class="muted">Chưa có câu nhiều lựa chọn.</p>'}
  </section></div>
  <section class="card"><h2>Danh sách cần xem lại</h2>
    ${iss.length?iss.map(x=>`<div class="issue"><span class="sev ${x.sev}"></span><span class="what"><b>${x.label}</b> · ${x.msg}</span><button class="btn small" data-act="edit" data-id="${x.id}">Sửa</button></div>`).join(''):'<p class="pill ok">Không thấy lỗi hình thức</p>'}
  </section>
  <div class="row"><button class="btn primary" data-act="go" data-v="export">Tiếp: Xuất đề →</button></div>`;

V.export=()=>{
  const cs=codes();if(!cs.includes(+S.ui.code))S.ui.code=cs[0];
  const m=S.ui.mode;
  const errs=issues().filter(x=>x.sev==='err').length;
  const modes=`<div class="filters">${[['exam','Đề theo mã'],['key','Đáp án các mã'],['matrix','Ma trận & đặc tả']].map(([k,l])=>`<button class="chip" data-act="mode" data-v="${k}" aria-pressed="${m===k}">${l}</button>`).join('')}</div>`;
  const lead=`<div class="lead"><div class="eyebrow">Bước 5 / 5</div><h1>Xem và xuất đề</h1><p class="sub">${m==='matrix'?'Chọn mẫu, tùy chỉnh cột và hướng trang, rồi tải file Word hoặc sao chép sang Word.':'Bấm sao chép rồi mở Word và dán (Ctrl+V). Định dạng Times New Roman 13, bảng đáp án và mã đề được giữ nguyên khi dán.'}</p></div>`;
  const warn=errs?`<div class="notice"><p>Đề còn <b>${errs} lỗi</b> chưa sửa. Vẫn xuất được, nhưng nên xem lại trước.</p><button class="btn small" data-act="go" data-v="review">Xem lỗi</button></div>`:'';
  if(m==='matrix'){
    const p=docParts();
    return lead+warn+`<section class="card">${modes}</section>`+tplPanel()+`<div class="sheets">${p.map(([k,o],i)=>`<div><p class="small muted" style="margin-bottom:6px">${k==='m'?'Ma trận':'Bản đặc tả'} · trang ${o==='landscape'?'ngang':'dọc'}</p><div class="sheet-frame"><div class="sheet ${o==='landscape'?'land':''}">${partHTML(k,i===0,i===p.length-1)}</div></div></div>`).join('')}</div>`;
  }
  const html=m==='exam'?examHTML(+S.ui.code):keyHTML();
  return lead+warn+`<section class="card">${modes}
    ${m==='exam'?`<div class="codes">${cs.map(c=>`<button class="chip" data-act="code" data-v="${c}" aria-pressed="${+S.ui.code===c}">Mã ${c}</button>`).join('')}</div>`:''}
    <div class="row">
      <label class="check"><input type="checkbox" id="x-sq" data-ui="shuffleQ" ${S.ui.shuffleQ?'checked':''}>Trộn thứ tự câu trong mỗi phần</label>
      <label class="check"><input type="checkbox" id="x-so" data-ui="shuffleO" ${S.ui.shuffleO?'checked':''}>Trộn phương án A–D</label>
    </div>
    <div class="row">
      <button class="btn primary" data-act="copy">${m==='exam'?`Sao chép đề mã ${S.ui.code}`:'Sao chép đáp án'}</button>
      ${m==='exam'?`<button class="btn" data-act="copy-all">Sao chép tất cả mã đề</button><button class="btn" data-act="exam-docx">Tải Word mã ${S.ui.code}</button><button class="btn" data-act="exam-docx-all">Tải Word tất cả mã</button>`:''}
    </div>
  </section>
  ${m==='exam'?etplPanel():''}
  <div class="sheet-frame"><div class="sheet">${html}</div></div>`;
};

function render(){
  const a=document.activeElement;
  const fid=a&&a.id&&main.contains(a)?a.id:null;
  let sel=null;try{if(fid&&typeof a.selectionStart==='number')sel=[a.selectionStart,a.selectionEnd]}catch(_){}
  LV=S.tpl.lv.map((x,i)=>String(x||'').trim()||DEFLV[i]);
  steps();
  main.innerHTML=(V[S.view]||V.info)();
  if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});try{if(sel)e.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  save();
}
function go(v){S.view=v;render();window.scrollTo({top:0})}
